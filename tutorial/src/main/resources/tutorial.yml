# ---------------------------------------------------------------------------
# BoxTutorial — what the tutorial teaches.
#
# Two sections:
#   steps:   the walkthrough, in order. Move a block up and it happens sooner.
#   topics:  the glossary, readable any time with /tutorial topics.
#
# The default steps run inside the practice yard (see `arena:` in config.yml):
# a wood mine, an ore mine, and a villager who trades ore for gear. The ladder
# is wood → axe → more wood → pickaxe → ore → sword → armour → compressed log
# → charm, which is the boxpvp loop in miniature. Everything they make is
# theirs to keep.
#
# Step settings
# -------------
#   icon:        the material shown in the menu
#   name:        the title, in colour
#   description: lines shown in chat and in the tile's lore
#   trigger:     what completes it (see the list below)
#   target:      what counts. A material (or a comma-separated list of them),
#                or `item:<id>` for one of the named items in config.yml —
#                which is what makes a step follow your own custom sword.
#   amount:      how many times (default 1)
#   command:     a command worth offering; shown click-to-run in chat
#   hint:        one extra line of advice
#   optional:    true = the player may always skip it
#   rewards:     commands: [] run from console (%player%), and message:
#
# Triggers
# --------
#   BREAK_BLOCK      target is a material — the mines are the only breakables
#   BUY_ITEM         target is what the trade gives you
#   HAVE_ITEM        target is an item; done when they're carrying it
#   OFFHAND_ITEM     target is an item; done when it's in their off hand
#   READ             done when the player clicks the step in the menu
#   MANUAL           done only by /tutorial complete
#   RUN_COMMAND      target is the command, without the slash
#   PLACE_BLOCK / PICK_UP_ITEM / CRAFT_ITEM / KILL_MOB / KILL_PLAYER
#   ENTER_WORLD      target is a world name
#   REACH_LOCATION   target is world;x;y;z;radius
#   PLAYTIME_MINUTES amount is the minutes, no target
#
# The gear steps use HAVE_ITEM rather than BUY_ITEM on purpose: it completes
# however they got the thing, so a player who buys ahead of the step isn't told
# to go and buy a second one.
# ---------------------------------------------------------------------------

steps:

  chop-wood:
    icon: OAK_LOG
    name: "<yellow>Break 8 logs"
    description:
      - "<gray>The wood mine is on your left. Punch it — no tool needed yet."
      - "<gray>Everything on this server starts as something you dug up."
    trigger: BREAK_BLOCK
    target: "OAK_LOG, DARK_OAK_LOG"
    amount: 8
    hint: "<dark_gray>Hold left-click on the logs."

  buy-axe:
    icon: WOODEN_AXE
    name: "<yellow>Trade 8 logs for an axe"
    description:
      - "<gray>Right-click the <gold>Trader<gray> behind you to open his trades."
      - "<gray>Put your logs in the left slot and take the axe."
      - "<gray>There is no money here — <white>what you dig up is the money<gray>."
    trigger: BUY_ITEM
    target: "item:axe"
    amount: 1
    hint: "<dark_gray>Dark oak trades one-for-one for oak, if you're short."

  chop-more:
    icon: OAK_LOG
    name: "<yellow>Break 16 more logs"
    description:
      - "<gray>Faster with the axe. Notice the mine filling itself back up —"
      - "<gray>that's how every mine on the server works, so you can never"
      - "<gray>run it dry and nobody can take it from you."
    trigger: BREAK_BLOCK
    target: "OAK_LOG, DARK_OAK_LOG"
    amount: 16
    hint: "<dark_gray>Better tools are always worth the ore they cost."

  get-pickaxe:
    icon: STONE_PICKAXE
    name: "<yellow>Trade 16 logs for a pickaxe"
    description:
      - "<gray>Stone and ore need a pickaxe — punching them gets you nothing."
      - "<gray>Back to the Trader."
    trigger: HAVE_ITEM
    target: "item:pickaxe"
    amount: 1
    hint: "<dark_gray>16 logs → pickaxe."

  mine-ore:
    icon: IRON_ORE
    name: "<yellow>Mine 24 blocks of ore"
    description:
      - "<gray>The ore mine is on your right: stone, coal and iron."
      - "<gray>Iron is what gear costs. Take everything — the cobblestone"
      - "<gray>trades for food, and nothing you dig up is worthless."
    trigger: BREAK_BLOCK
    target: "STONE, COAL_ORE, IRON_ORE"
    amount: 24
    hint: "<dark_gray>Raw iron is the one that matters."

  get-sword:
    icon: IRON_SWORD
    name: "<yellow>Buy a sword"
    description:
      - "<gray>3 raw iron. On the real server this is the moment you stop"
      - "<gray>being somebody else's loot."
    trigger: HAVE_ITEM
    target: "item:sword"
    amount: 1
    hint: "<dark_gray>Not enough iron? The mine is still there."

  get-armour:
    icon: IRON_CHESTPLATE
    name: "<yellow>Buy armour, and put it on"
    description:
      - "<gray>5 raw iron. Then wear it."
      - "<gray>Out there you'll lose this eventually — everyone does."
      - "<gray>Gear is something you <white>spend<gray>, not something you keep."
    trigger: HAVE_ITEM
    target: "item:armor"
    amount: 1

  compress-logs:
    icon: OAK_LOG
    name: "<gold>Fold 64 logs into one"
    description:
      - "<gray>Now the long one: 64 logs buys a <gold>Compressed Log<gray>."
      - "<gray>Compacting is how anybody carries a real haul — a full"
      - "<gray>inventory of ore is a full inventory you can't mine into."
      - "<gray>The mine refills. Keep going."
    trigger: HAVE_ITEM
    target: "item:compressed_log"
    amount: 1
    hint: "<dark_gray>This is the grind. It's meant to be — the charm is worth it."

  get-charm:
    icon: NETHER_STAR
    name: "<light_purple>Trade it for the charm"
    description:
      - "<gray>One compressed log, one charm. It's the only thing in here"
      - "<gray>that makes <white>you<gray> stronger rather than your gear."
    trigger: HAVE_ITEM
    target: "item:charm"
    amount: 1

  equip-charm:
    icon: SHIELD
    name: "<light_purple>Put the charm in your off hand"
    description:
      - "<gray>A charm does nothing in your backpack. Off-hand slot —"
      - "<gray>press <white>F<gray> while holding it."
      - "<gray>Watch your hearts when it lands."
    trigger: OFFHAND_ITEM
    target: "item:charm"
    amount: 1
    hint: "<dark_gray>That's everything. You're done after this one."
    rewards:
      message: "<green>Kitted out. Everything you're carrying comes with you."

# ---------------------------------------------------------------------------
# The glossary. /tutorial topics, or /tutorial what <id>.
# ---------------------------------------------------------------------------
topics:

  boxpvp:
    icon: GRASS_BLOCK
    title: "<gold>BoxPvP"
    lines:
      - "<gray>A PvP gamemode built around a short economy loop instead"
      - "<gray>of survival. You mine in a shared, regenerating mine, sell"
      - "<gray>for money, buy gear, and fight over the areas worth fighting"
      - "<gray>over. Progress is money and rank, not a base."

  your-box:
    icon: CHEST
    title: "<gold>Your box"
    lines:
      - "<gray>Your own private space: storage, safety, and somewhere to"
      - "<gray>stand while you sort your inventory. Nobody can hit you or"
      - "<gray>take anything there. Everything you'd hate to drop belongs"
      - "<gray>in it before you go anywhere dangerous."

  the-mine:
    icon: STONE
    title: "<gold>The mine"
    lines:
      - "<gray>A shared pit that fills itself back in — the one you just"
      - "<gray>used, but bigger and full of people."
      - "<gray>Most mines are <red>not<gray> safezones: someone can turn up"
      - "<gray>while your inventory is full. That's the trade."

  money:
    icon: GOLD_INGOT
    title: "<gold>Money"
    lines:
      - "<gray>The actual score. It comes from selling what you gather and"
      - "<gray>goes on gear, kits and rank."
      - "<gray>Money in the bank survives your death; the diamonds in your"
      - "<gray>backpack don't. Sell early."

  warzone:
    icon: NETHERITE_SWORD
    title: "<red>The warzone"
    lines:
      - "<gray>Wherever PvP is switched on. Loot, events and the best"
      - "<gray>money live there, and so does everyone hunting you."
      - "<gray>Go in with gear you can replace, and leave when you're"
      - "<gray>carrying more than you're willing to lose."

  combat-tag:
    icon: CLOCK
    title: "<red>Combat tag"
    lines:
      - "<gray>The moment you hit a player or get hit, you're tagged for a"
      - "<gray>few seconds. While tagged you usually can't teleport, warp"
      - "<gray>or fly, and quitting is treated as dying."
      - "<gray>It exists so nobody escapes a fight they're losing."

  dying:
    icon: BONE
    title: "<gold>Dying"
    lines:
      - "<gray>You drop what you were carrying and respawn. That's it —"
      - "<gray>no lost levels, no lost box, no lost money."
      - "<gray>Everyone here has died hundreds of times. Treat gear as"
      - "<gray>ammunition and it stops stinging."

  kits-and-crates:
    icon: ENDER_CHEST
    title: "<gold>Kits and crates"
    lines:
      - "<gray>Kits hand you a set of gear on a cooldown; claim yours every"
      - "<gray>time it's up, even when you don't need it, and sell the"
      - "<gray>spares."
      - "<gray>Crates are the keyed reward chests at spawn."

  koth:
    icon: BEACON
    title: "<gold>KOTH"
    lines:
      - "<gray>King of the hill: stand in a marked area for long enough"
      - "<gray>without being knocked out of it, and the reward is yours."
      - "<gray>It's the fight everyone shows up for, and the fastest way to"
      - "<gray>learn how the server's best players fight."

  getting-help:
    icon: PAPER
    title: "<gold>Getting help"
    lines:
      - "<gray>Ask in chat first — most questions are answered in seconds."
      - "<gray>Read the rules before you test them; being griefed is part"
      - "<gray>of the game, being scammed usually isn't."
      - "<gray>Staff are the ones with coloured names."
