name: RoboBear
version: '${project.version}'
main: com.diamend.robobear.RoboBearPlugin
api-version: '1.21'
softdepend: [MineResetLite, PlaceholderAPI]
author: diamend
description: A Bee Swarm Simulator style challenge ladder over your mines — timed rounds, a choice of jobs, Cogs and milestone payouts.
website: https://github.com/diamend-box/box

commands:
  robobear:
    description: Open Robo Bear's menu and run the challenge ladder.
    usage: |
      /rb                       - Open the menu
      /rb start                 - Start a run (or get back to the one you're in)
      /rb retire                - Stop here and keep what you've been paid
      /rb cancel                - Abandon the run
      /rb stats [player]        - Runs, deepest round and payouts
      /rb mines                 - List the mines RoboBear can see (admin)
      /rb mines debug           - Explain what the MineResetLite reader sees (admin)
      /rb milestones            - Edit the milestone payouts (admin)
      /rb pos1 | /rb pos2       - Select a corner for a manual mine (admin)
      /rb mine set <id>         - Save the selection as a mine (admin)
      /rb mine delete <id>      - Delete a manual mine (admin)
      /rb reset <player>        - Wipe a player's RoboBear data (admin)
      /rb reload                - Reload configuration from disk (admin)
    aliases: [rb, robo]

permissions:
  robobear.use:
    description: Allows opening the menu and running the challenge.
    default: true
  robobear.admin:
    description: Allows editing payouts and mines, and editing player data.
    default: op
