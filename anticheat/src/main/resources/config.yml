# ============================================================================
#  AntiCheat - packet-level anticheat for Paper 1.21.4
#
#  Tip: almost everything here can also be toggled in-game from the GUI
#  (/ac gui). This file is the source of truth the GUI reads and writes.
# ============================================================================

# How the anticheat reacts when a check crosses a punishment threshold:
#   alert-only : only ever notify staff and write to the log (the safe default)
#   enforce    : also carry out the per-check `actions` below (cancel/kick/ban)
# You can flip this live with: /ac mode enforce   (or the GUI mode button)
mode: alert-only

violations:
  # Violation points bled off per second, so an occasional flag never
  # accumulates into a punishment. 0.05 = one point roughly every 20 seconds.
  decay-per-second: 0.05

# Situations where checks are skipped entirely to avoid false positives.
exemptions:
  login-grace-ms: 3000      # ignore the first N ms after a player joins
  teleport-grace-ms: 1500   # ignore N ms after a teleport / respawn
  max-ping: 400             # skip players with a ping above this (ms); 0 disables
  min-tps: 16.0             # skip all checks while server TPS is below this

alerts:
  verbose-by-default: false # (reserved) whether staff start with verbose on

# ----------------------------------------------------------------------------
#  Passive protections
#
#  These don't flag anyone; they starve client-side cheats of the data they
#  rely on. No violation levels, just on/off (toggle in the GUI too).
# ----------------------------------------------------------------------------
protections:

  # Anti health-indicators: rewrite other players' HP to full in outgoing
  # EntityMetadata so Meteor-style HP nametags always read 20. Real health on
  # the server is untouched; players still see their own true health.
  health-indicators:
    enabled: true
    shown-health: 20.0

  # Anti-ESP: hide players who are out of a viewer's line of sight so ESP has
  # nothing to draw. This one reads the world, so it runs on a throttled main
  # thread; leave it off unless ESP is a real problem, and watch CPU on big
  # servers. Staff (anticheat.alerts / anticheat.bypass) are never hidden.
  anti-esp:
    enabled: false
    max-distance: 64          # only cull targets within this many blocks
    min-distance: 6           # never cull closer than this (avoids pop-in)
    interval-ticks: 4         # how often the sweep runs

  # Anti-Xray is intentionally NOT reimplemented here — Paper ships a mature,
  # well-optimised block obfuscator. Turn it on in paper-world-defaults.yml:
  #   anticheat.obfuscation.items.<world> ... engine-mode: 2
  # See the README for the full rationale and the intercept outline.

# ----------------------------------------------------------------------------
#  Checks
#
#  enabled         : whether the check runs at all
#  alert-threshold : violation level at which staff start getting alerts
#  settings        : per-check numeric knobs (see comments)
#  actions         : "<threshold> <type> [argument]" lines, only run in
#                    `enforce` mode. Types: cancel, command, kick, ban.
#                    %player% is replaced with the player's name.
# ----------------------------------------------------------------------------
checks:

  # ===== Combat =====

  reach:
    enabled: true
    alert-threshold: 5
    settings:
      max-distance: 3.05      # blocks; vanilla survival reach is 3.0
    actions:
      - "10 cancel"
      - "25 kick Reaching too far"

  autoclicker:
    enabled: true
    alert-threshold: 6
    settings:
      max-cps: 16             # sustained clicks/second ceiling
      min-cov: 0.08           # min coefficient of variation of click intervals
      min-samples: 10         # clicks needed before judging
    actions:
      - "20 kick Autoclicker"

  aim:
    enabled: true
    alert-threshold: 8
    settings:
      impossible-pitch-vl: 5
      min-yaw-delta: 0.6
      min-gcd-units: 20000
      gcd-vl: 0.5
    actions:
      - "25 kick Aim assistance"

  killaura:
    enabled: true
    alert-threshold: 6
    settings:
      max-hit-angle: 80
      angle-vl: 1
      no-swing-ms: 1000
      no-swing-vl: 1
      multi-target-ms: 150
      multi-target-vl: 1
    actions:
      - "20 kick Killaura"

  # ===== Movement =====

  # Jetpack / Fly: predictive vertical physics. Flags a player who defies
  # gravity's descent while airborne, tick after tick.
  flight:
    enabled: true
    alert-threshold: 6
    settings:
      lift-tolerance: 0.05    # vertical excess (blocks/tick) that counts as lift
      min-lift-ticks: 6       # consecutive lift ticks before flagging a hover
      big-excess: 0.5         # a single tick of this much lift flags instantly
      sustained-vl: 1.0
      big-vl: 4.0
      velocity-grace-ms: 1200 # ignore lift this long after knockback
    actions:
      - "12 cancel"
      - "25 kick Flight"

  # Blatant horizontal overspeed. Deliberately generous so legit boosts pass.
  speed:
    enabled: true
    alert-threshold: 8
    settings:
      max-horizontal: 0.7     # blocks/tick ceiling (vanilla sprint ~0.28)
      min-fast-ticks: 4
      vl: 1.0
      velocity-grace-ms: 1200
    actions:
      - "25 kick Speed"

  # NoFall: client claims onGround=true in mid-air to dodge fall damage.
  nofall:
    enabled: true
    alert-threshold: 5
    settings:
      min-fall: 2.0           # blocks fallen before the cache-based signal fires
      falling-threshold: -0.4 # motionY at/under which "onGround" is impossible
      vl: 2.0
    actions:
      - "20 kick NoFall"

  # Timer / packet-balance: too many movement packets for real time to allow.
  timer:
    enabled: true
    alert-threshold: 6
    settings:
      min-balance: -5.0       # token balance at/under which we flag
      relax-to: -2.0          # pull the balance back here after a flag
      vl: 1.0
    actions:
      - "15 cancel"
      - "25 kick Timer"

  # BoatFly / entity speed: the same physics test applied to ridden vehicles.
  vehicle:
    enabled: true
    alert-threshold: 6
    settings:
      lift-tolerance: 0.05
      min-lift-ticks: 5
      big-excess: 0.5
      sustained-vl: 1.5
      big-vl: 4.0
    actions:
      - "12 cancel"
      - "25 kick Vehicle flight"

  # ===== World =====

  # Scaffold: automated bridging. Timing + look-to-face raytrace.
  scaffold:
    enabled: true
    alert-threshold: 6
    settings:
      instant-ms: 10          # placements this close together are automated
      delay-min-samples: 5
      delay-min-cov: 0.05     # placement rhythm below this is inhumanly regular
      instant-vl: 1.0
      regular-vl: 1.0
      max-face-angle: 85      # looking this far off the clicked face is impossible
      angle-vl: 1.5
    actions:
      - "15 cancel"
      - "25 kick Scaffold"
