name: Release RoboBear

# Publishing is driven by a tag so the release always points at an exact
# commit. Tag format: robobear-v1.0.0 — scoped, because this repository holds
# several plugins and a bare vX.Y.Z already means CustomAchievements.
#
#   git tag -a robobear-v1.0.0 -m "RoboBear 1.0.0"
#   git push origin robobear-v1.0.0

on:
  push:
    tags: [ "robobear-v*" ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (e.g. robobear-v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the tag
        id: tag
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#robobear-v}"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing RoboBear $VERSION from tag $TAG"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # A tag that claims 1.0.0 while the pom says something else would ship a
      # jar whose /version output contradicts its own release page.
      - name: Check the tag matches the pom
        working-directory: robobear
        run: |
          set -euo pipefail
          POM=$(mvn -B -ntp -q help:evaluate -Dexpression=project.version -DforceStdout)
          echo "pom version: $POM / tag version: ${{ steps.tag.outputs.version }}"
          if [ "$POM" != "${{ steps.tag.outputs.version }}" ]; then
            echo "::error::tag says ${{ steps.tag.outputs.version }} but robobear/pom.xml says $POM"
            exit 1
          fi

      # Tests run here on purpose: nothing gets a download link without passing
      # them first.
      - name: Build and test
        working-directory: robobear
        run: mvn -B -ntp clean package

      - name: Name the jar
        id: jar
        run: |
          set -euo pipefail
          JAR=$(ls robobear/target/RoboBear-*.jar | grep -v -- '-sources\|-javadoc' | head -n1)
          [ -n "$JAR" ] || { echo "::error::no jar was produced"; exit 1; }
          echo "path=$JAR" >> "$GITHUB_OUTPUT"
          ls -la "$JAR"

      - name: Write the release notes
        run: |
          cat > notes.md <<'NOTES'
          A Bee Swarm Simulator style **Robo Bear Challenge** built on the mines your
          server already has: a ladder of timed rounds, a choice of job at the top of
          each one, Cogs to spend on upgrades between them, and payouts you decide at
          milestone rounds.

          ### Install

          Drop the jar in `plugins/` and restart. Then `/rb mines` to check it found
          your mines, and `/rb milestones` to fill in what the ladder pays — **a run
          pays nothing until you do**, because the starter tiers ship empty on purpose.

          Full setup, tuning and troubleshooting: **[the operator's guide](https://github.com/Diamend-box/box/blob/__TAG__/robobear/GUIDE.md)**.

          ### What's in it

          - **Runs on your mines.** Reads them from MineResetLite automatically, with
            an in-game manual fallback (`/rb pos1`, `/rb pos2`, `/rb mine set <id>`)
            for servers without it. The mining hot path never calls another plugin.
          - **A real decision every round.** Two offers, spread across difficulty —
            the greedy one pays more Cogs and is likelier to end the run.
          - **A workshop.** Six upgrades: drill speed, movement, damage, armour, extra
            time and extra Cogs. Costs climb per level, so nobody maxes one thing.
          - **Payouts you set in game.** `/rb milestones` opens a chest — put real
            items in it and that's what a milestone pays. No reward number, no
            multiplier, no economy hook.
          - **Nothing carries out of a run.** Cogs are minted at entry, spent inside,
            and destroyed at the end. Not a second currency.
          - **PvP-aware defaults.** Payouts drop on the floor the way a kill does, the
            bossbar is left alone, and dying or logging out ends the run.
          - ~20 PlaceholderAPI placeholders, per-player stats, async saves.

          ### Requirements

          Paper 1.21.4+ and Java 21. MineResetLite and PlaceholderAPI are optional —
          the plugin enables cleanly without either.

          ### Verified

          Compiles against paper-api 1.21.4, passes its unit and MockBukkit suites, and
          boots clean on a headless Paper 1.21.4 in CI.

          **Not verified:** the MineResetLite integration has never been exercised
          against the real plugin (it's reflective, and it logs the class it found if
          it can't read your build), and the balance numbers are unplaytested. Start
          with `objectives.*.growth` — it decides how long a run lasts.
          NOTES
          # Point the docs link at the tagged commit, so it resolves whether or
          # not this branch has reached the default branch yet.
          sed -i "s|__TAG__|${{ steps.tag.outputs.tag }}|g" notes.md
          echo "--- notes.md ---"; cat notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists — updating it."
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "RoboBear ${{ steps.tag.outputs.version }}" \
              --notes-file notes.md
            gh release upload "$TAG" "${{ steps.jar.outputs.path }}" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "${{ steps.jar.outputs.path }}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "RoboBear ${{ steps.tag.outputs.version }}" \
              --notes-file notes.md
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY"
