name: Verify AntiCheat

on:
  push:
    branches: [ "main", "claude/minecraft-anticheat-plan-suttic" ]
    paths:
      - "anticheat/**"
      - ".github/workflows/anticheat.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "anticheat/**"
      - ".github/workflows/anticheat.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: anticheat

jobs:
  # ---------------------------------------------------------------
  # Build the shippable, shaded jar and publish it as an artifact.
  # This is how the jar is produced — the plugin's compile deps
  # (paper-api, packetevents) live on repos the dev sandbox can't
  # reach, so CI is the build.
  # ---------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Package
        run: mvn -B -ntp -DskipTests clean package
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: AntiCheat-jar
          path: anticheat/target/AntiCheat-*.jar
          if-no-files-found: error
          retention-days: 90

  # ---------------------------------------------------------------
  # Behavioural unit tests (pure check logic) via MockBukkit.
  # ---------------------------------------------------------------
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run tests
        run: mvn -B -ntp test
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anticheat-surefire-reports
          path: anticheat/target/surefire-reports/**
          if-no-files-found: warn

  # ---------------------------------------------------------------
  # Boot a real headless Paper 1.21.4 and confirm the plugin enables
  # cleanly (packetevents installs, no linkage errors) and its
  # command responds.
  # ---------------------------------------------------------------
  server-smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Download built jar
        uses: actions/download-artifact@v4
        with:
          name: AntiCheat-jar
          path: artifact
      - name: Fetch latest Paper 1.21.4
        working-directory: .
        run: |
          set -uo pipefail
          VER=1.21.4
          UA="diamend-box-box-ci/1.0 (+https://github.com/Diamend-box/box)"
          curl -sf -H "User-Agent: $UA" \
            "https://fill.papermc.io/v3/projects/paper/versions/$VER/builds" -o builds.json \
            || { echo "::error::failed to query Paper Fill API"; exit 1; }
          URL=$(jq -r '(if type=="array" then . else .builds end)
                       | max_by(.id)
                       | (.downloads["server:default"].url // .downloads.application.url // empty)' builds.json)
          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "::error::could not resolve a Paper download URL"; head -c 2000 builds.json; exit 1
          fi
          echo "Downloading: $URL"
          curl -sf -H "User-Agent: $UA" -o paper.jar "$URL" || { echo "::error::download failed"; exit 1; }
          ls -la paper.jar
      - name: Boot server with the plugin
        working-directory: .
        run: |
          set -uo pipefail
          mkdir -p run/plugins
          cp artifact/*.jar run/plugins/
          cd run
          echo "eula=true" > eula.txt
          printf 'online-mode=false\nlevel-type=minecraft\\:flat\nmax-players=2\nspawn-protection=0\nview-distance=4\n' > server.properties
          mkfifo cmd
          java -Xmx2G -jar ../paper.jar --nogui < cmd > server.log 2>&1 &
          SRV=$!
          exec 3> cmd
          echo "Waiting for server startup..."
          for i in $(seq 1 120); do
            if grep -q "Done (" server.log 2>/dev/null; then echo "Server started."; break; fi
            if ! kill -0 "$SRV" 2>/dev/null; then echo "Server process exited early."; break; fi
            sleep 2
          done
          echo "ac checks" >&3
          sleep 3
          echo "ac mode" >&3
          sleep 2
          echo "stop" >&3
          for i in $(seq 1 45); do kill -0 "$SRV" 2>/dev/null || break; sleep 2; done
          kill "$SRV" 2>/dev/null || true
          exec 3>&- || true
          echo "=================== server.log (tail) ==================="
          tail -n 100 server.log || true
      - name: Assert clean enable and working command
        working-directory: .
        run: |
          set -uo pipefail
          LOG=run/server.log
          fail=0
          need() { grep -q "$1" "$LOG" && echo "ok: $2" || { echo "::error::MISSING: $2"; fail=1; }; }
          need "Enabling AntiCheat"        "plugin began enabling"
          need "AntiCheat enabled in"      "onEnable completed without throwing"
          need "checks active"             "enable banner printed the check summary"
          if grep -nE "Error occurred while enabling AntiCheat|Could not load .plugins.*AntiCheat|NoClassDefFoundError|NoSuchMethodError|NoSuchFieldError|IncompatibleClassChangeError|Exception while enabling" "$LOG"; then
            echo "::error::linkage or enable error found in server log"
            fail=1
          fi
          exit $fail
      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anticheat-server-log
          path: run/server.log
          if-no-files-found: warn
