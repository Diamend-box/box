name: Verify CustomAchievements

on:
  push:
    branches: [ "main", "claude/minecraft-custom-achievements-uznj9d" ]
    paths:
      - "customachievements/**"
      - ".github/workflows/customachievements.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: customachievements

jobs:
  # ---------------------------------------------------------------
  # Build the shippable jar (no tests, so it always produces output).
  # ---------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Package
        run: mvn -B -ntp -DskipTests clean package
      - name: Assert AnvilGUI is shaded and relocated
        run: |
          set -uo pipefail
          JAR=$(ls target/CustomAchievements-*.jar | head -1)
          echo "Inspecting $JAR"
          LIST=$(unzip -l "$JAR")
          # The relocated AnvilGUI entrypoint must be bundled.
          echo "$LIST" | grep -q "com/diamend/customachievements/libs/anvilgui/AnvilGUI.class" \
            || { echo "::error::relocated AnvilGUI entrypoint missing from jar (bad shade)"; exit 1; }
          # The NMS version wrappers must be bundled too, else the anvil throws
          # NoClassDefFoundError at open time (which the smoke test can't reach).
          echo "$LIST" | grep -qE "com/diamend/customachievements/libs/anvilgui/version/.+\.class" \
            || { echo "::error::AnvilGUI version wrappers missing from jar (bad shade include)"; exit 1; }
          # The original package must NOT leak (would clash with other plugins
          # that also shade AnvilGUI).
          if echo "$LIST" | grep -qE " net/wesjd/anvilgui/"; then
            echo "::error::un-relocated net.wesjd.anvilgui classes present in jar"; exit 1
          fi
          echo "AnvilGUI is bundled and relocated correctly."
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: CustomAchievements-jar
          path: customachievements/target/CustomAchievements-*.jar
          if-no-files-found: error

  # ---------------------------------------------------------------
  # Behavioural tests against a real Bukkit/Paper API via MockBukkit.
  # ---------------------------------------------------------------
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run tests
        run: mvn -B -ntp test
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: customachievements-surefire-reports
          path: customachievements/target/surefire-reports/**
          if-no-files-found: warn

  # ---------------------------------------------------------------
  # Boot a real headless Paper 1.21.4 server and confirm the plugin
  # enables cleanly and its command responds.
  # ---------------------------------------------------------------
  server-smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Download built jar
        uses: actions/download-artifact@v4
        with:
          name: CustomAchievements-jar
          path: artifact
      - name: Fetch latest Paper 1.21.4
        working-directory: .
        run: |
          set -uo pipefail
          VER=1.21.4
          UA="diamend-box-box-ci/1.0 (+https://github.com/Diamend-box/box)"
          # Paper's v2 API was retired; use the v3 "Fill" API (requires a UA).
          curl -sf -H "User-Agent: $UA" \
            "https://fill.papermc.io/v3/projects/paper/versions/$VER/builds" -o builds.json \
            || { echo "::error::failed to query Paper Fill API"; exit 1; }
          URL=$(jq -r '(if type=="array" then . else .builds end)
                       | max_by(.id)
                       | (.downloads["server:default"].url // .downloads.application.url // empty)' builds.json)
          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "::error::could not resolve a Paper download URL"; head -c 2000 builds.json; exit 1
          fi
          echo "Downloading: $URL"
          curl -sf -H "User-Agent: $UA" -o paper.jar "$URL" || { echo "::error::download failed"; exit 1; }
          ls -la paper.jar
      - name: Boot server with the plugin
        working-directory: .
        run: |
          set -uo pipefail
          mkdir -p run/plugins
          cp artifact/*.jar run/plugins/
          cd run
          echo "eula=true" > eula.txt
          printf 'online-mode=false\nlevel-type=minecraft\\:flat\nmax-players=2\nspawn-protection=0\nview-distance=4\n' > server.properties
          mkfifo cmd
          java -Xmx2G -jar ../paper.jar --nogui < cmd > server.log 2>&1 &
          SRV=$!
          exec 3> cmd
          echo "Waiting for server startup..."
          for i in $(seq 1 120); do
            if grep -q "Done (" server.log 2>/dev/null; then echo "Server started."; break; fi
            if ! kill -0 "$SRV" 2>/dev/null; then echo "Server process exited early."; break; fi
            sleep 2
          done
          echo "achievements list" >&3
          sleep 4
          echo "stop" >&3
          for i in $(seq 1 45); do kill -0 "$SRV" 2>/dev/null || break; sleep 2; done
          kill "$SRV" 2>/dev/null || true
          exec 3>&- || true
          echo "=================== server.log (tail) ==================="
          tail -n 80 server.log || true
      - name: Assert clean enable and working command
        working-directory: .
        run: |
          set -uo pipefail
          LOG=run/server.log
          fail=0
          need() { grep -q "$1" "$LOG" && echo "ok: $2" || { echo "::error::MISSING: $2"; fail=1; }; }
          need "Enabling CustomAchievements"   "plugin began enabling"
          need "CustomAchievements enabled."   "onEnable completed without throwing"
          need "custom achievement"            "achievements were loaded"
          need "getting_wood"                  "/achievements list produced output"
          if grep -nE "Error occurred while enabling CustomAchievements|Could not load .plugins.*CustomAchievements|NoClassDefFoundError|NoSuchMethodError|NoSuchFieldError|IncompatibleClassChangeError|Exception while enabling" "$LOG"; then
            echo "::error::linkage or enable error found in server log"
            fail=1
          fi
          exit $fail
      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: customachievements-server-log
          path: run/server.log
          if-no-files-found: warn
