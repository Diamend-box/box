name: Verify plugin

on:
  push:
    branches: [ "claude/minecraft-custom-achievements-uznj9d" ]
    paths-ignore: [ "**/*.md" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------
  # Build the shippable jar (no tests, so it always produces output).
  # ---------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Package
        run: mvn -B -ntp -DskipTests clean package
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: plugin-jar
          path: target/*.jar
          if-no-files-found: error

  # ---------------------------------------------------------------
  # Behavioural tests against a real Bukkit/Paper API via MockBukkit.
  # ---------------------------------------------------------------
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run tests
        run: mvn -B -ntp test
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/**
          if-no-files-found: warn

  # ---------------------------------------------------------------
  # Boot a real headless Paper 1.21.4 server and confirm the plugin
  # enables cleanly and its command responds.
  # ---------------------------------------------------------------
  server-smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Download built jar
        uses: actions/download-artifact@v4
        with:
          name: plugin-jar
          path: artifact
      - name: Fetch latest Paper 1.21.4
        run: |
          set -euo pipefail
          VER=1.21.4
          BUILD=$(curl -sf "https://api.papermc.io/v2/projects/paper/versions/$VER/builds" | jq -r '.builds[-1].build')
          echo "Using Paper $VER build $BUILD"
          curl -sf -o paper.jar \
            "https://api.papermc.io/v2/projects/paper/versions/$VER/builds/$BUILD/downloads/paper-$VER-$BUILD.jar"
      - name: Boot server with the plugin
        run: |
          set -uo pipefail
          mkdir -p run/plugins
          cp artifact/*.jar run/plugins/
          cd run
          echo "eula=true" > eula.txt
          printf 'online-mode=false\nlevel-type=minecraft\\:flat\nmax-players=2\nspawn-protection=0\nview-distance=4\n' > server.properties
          mkfifo cmd
          java -Xmx2G -jar ../paper.jar --nogui < cmd > server.log 2>&1 &
          SRV=$!
          exec 3> cmd
          echo "Waiting for server startup..."
          for i in $(seq 1 120); do
            if grep -q "Done (" server.log 2>/dev/null; then echo "Server started."; break; fi
            if ! kill -0 "$SRV" 2>/dev/null; then echo "Server process exited early."; break; fi
            sleep 2
          done
          echo "achievements list" >&3
          sleep 4
          echo "stop" >&3
          for i in $(seq 1 45); do kill -0 "$SRV" 2>/dev/null || break; sleep 2; done
          kill "$SRV" 2>/dev/null || true
          exec 3>&- || true
          echo "=================== server.log (tail) ==================="
          tail -n 80 server.log || true
      - name: Assert clean enable and working command
        run: |
          set -uo pipefail
          LOG=run/server.log
          fail=0
          need() { grep -q "$1" "$LOG" && echo "ok: $2" || { echo "::error::MISSING: $2"; fail=1; }; }
          need "Enabling CustomAchievements"   "plugin began enabling"
          need "CustomAchievements enabled."   "onEnable completed without throwing"
          need "custom achievement"            "achievements were loaded"
          need "getting_wood"                  "/achievements list produced output"
          if grep -nE "Error occurred while enabling CustomAchievements|Could not load .plugins.*CustomAchievements|NoClassDefFoundError|NoSuchMethodError|NoSuchFieldError|IncompatibleClassChangeError|Exception while enabling" "$LOG"; then
            echo "::error::linkage or enable error found in server log"
            fail=1
          fi
          exit $fail
      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: run/server.log
          if-no-files-found: warn
