name: Verify Spyglass

on:
  push:
    branches: [ "main" ]
    paths:
      - "spyglass/**"
      - ".github/workflows/spyglass.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "spyglass/**"
      - ".github/workflows/spyglass.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: spyglass

jobs:
  # ---------------------------------------------------------------
  # Build the shippable jar. The plugin's compile deps (paper-api)
  # live on repos the dev sandbox can't reach, so CI is the build.
  # ---------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Package
        run: mvn -B -ntp -DskipTests clean package
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: Spyglass-jar
          path: spyglass/target/Spyglass-*.jar
          if-no-files-found: error
          retention-days: 90

  # ---------------------------------------------------------------
  # The NBT reader and the offline inspector run against a save file
  # built to look like a real one; the command runs against a real
  # Paper API via MockBukkit.
  # ---------------------------------------------------------------
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run tests
        run: mvn -B -ntp test
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spyglass-surefire-reports
          path: spyglass/target/surefire-reports/**
          if-no-files-found: warn

  # ---------------------------------------------------------------
  # Boot a real headless Paper 1.21.4 and drive the plugin from the
  # console — which is the whole point of it, so the smoke test is
  # the console typing the commands a server owner would type.
  # ---------------------------------------------------------------
  server-smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Checked out first, and before the jar is downloaded: this job needs
      # tools/make-playerdata.py, and checkout cleans the directory it lands in.
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Download built jar
        uses: actions/download-artifact@v4
        with:
          name: Spyglass-jar
          path: artifact
      - name: Fetch latest Paper 1.21.4
        working-directory: .
        run: |
          set -uo pipefail
          VER=1.21.4
          UA="diamend-box-box-ci/1.0 (+https://github.com/Diamend-box/box)"
          curl -sf -H "User-Agent: $UA" \
            "https://fill.papermc.io/v3/projects/paper/versions/$VER/builds" -o builds.json \
            || { echo "::error::failed to query Paper Fill API"; exit 1; }
          URL=$(jq -r '(if type=="array" then . else .builds end)
                       | max_by(.id)
                       | (.downloads["server:default"].url // .downloads.application.url // empty)' builds.json)
          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "::error::could not resolve a Paper download URL"; head -c 2000 builds.json; exit 1
          fi
          echo "Downloading: $URL"
          curl -sf -H "User-Agent: $UA" -o paper.jar "$URL" || { echo "::error::download failed"; exit 1; }
          ls -la paper.jar
      - name: Boot server and drive /spy from the console
        working-directory: .
        run: |
          set -uo pipefail
          mkdir -p run/plugins
          cp artifact/*.jar run/plugins/
          cd run
          echo "eula=true" > eula.txt
          printf 'online-mode=false\nlevel-type=minecraft\\:flat\nmax-players=2\nspawn-protection=0\nview-distance=4\n' > server.properties
          mkfifo cmd
          java -Xmx2G -jar ../paper.jar --nogui < cmd > server.log 2>&1 &
          SRV=$!
          exec 3> cmd
          echo "Waiting for server startup..."
          for i in $(seq 1 120); do
            if grep -q "Done (" server.log 2>/dev/null; then echo "Server started."; break; fi
            if ! kill -0 "$SRV" 2>/dev/null; then echo "Server process exited early."; break; fi
            sleep 2
          done
          # Seed a save for a player who has never logged in. This is the only
          # way to prove the offline half against a real server: the file is
          # written by a separate script, from Mojang's format, so the test
          # cannot pass just because the plugin agrees with itself.
          GHOST=11111111-2222-3333-4444-555555555555
          python3 ../spyglass/tools/make-playerdata.py world "$GHOST"
          # The console is the audience for this plugin, so the console asks.
          echo "spy" >&3
          sleep 2
          echo "spy sections" >&3
          sleep 2
          echo "spy list" >&3
          sleep 2
          echo "spy watching" >&3
          sleep 2
          echo "spy find diamond" >&3
          sleep 2
          echo "spy watch Absentee chat blocks" >&3
          sleep 2
          echo "spy watching" >&3
          sleep 2
          echo "spy unwatch all" >&3
          sleep 2
          echo "spy NoSuchPlayer" >&3
          sleep 2
          # Reading a player who is not here, out of the file on disk.
          echo "spy $GHOST" >&3
          sleep 3
          echo "spy $GHOST inventory" >&3
          sleep 3
          echo "spy $GHOST vitals" >&3
          sleep 3
          echo "spy $GHOST enderchest" >&3
          sleep 3
          echo "spy $GHOST item 0" >&3
          sleep 3
          echo "spy $GHOST nbt abilities" >&3
          sleep 3
          echo "spy dump $GHOST" >&3
          sleep 4
          echo "spy reload" >&3
          sleep 3
          echo "stop" >&3
          for i in $(seq 1 45); do kill -0 "$SRV" 2>/dev/null || break; sleep 2; done
          kill "$SRV" 2>/dev/null || true
          exec 3>&- || true
          echo "=================== server.log (tail) ==================="
          tail -n 150 server.log || true
      - name: Assert clean enable and working console commands
        working-directory: .
        run: |
          set -uo pipefail
          LOG=run/server.log
          fail=0
          need() { grep -q "$1" "$LOG" && echo "ok: $2" || { echo "::error::MISSING: $2"; fail=1; }; }
          need "Enabling Spyglass"            "plugin began enabling"
          need "Spyglass enabled with"        "onEnable completed without throwing"
          need "watch categories"             "enable banner printed"
          need "Sections"                     "/spy sections answered"
          need "enderchest"                   "the section list is complete"
          need "Online players"               "/spy list answered"
          need "Active watches"               "/spy watching answered"
          need "Watching Absentee"            "a watch can be set on someone offline"
          need "No player called"             "an unknown name is reported, not thrown"
          need "Reloaded configuration"       "/spy reload worked"
          # The offline half, against a save this server never wrote.
          need "(offline)"                    "an offline player can be inspected at all"
          need "Excalibur"                    "a component-style item name is read"
          need "sharpness 5"                  "enchantments are read from the item components"
          need "cooked_beef x32"              "stack counts are read"
          need "netherite_helmet"             "armour slots are read"
          need "elytra"                       "the ender chest is read"
          need "17.5/20"                      "health comes out of the save file"
          need "flySpeed: 0.05f"              "/spy <uuid> nbt <path> walks the raw tree"
          need "Wrote"                        "/spy dump wrote a report"
          if ! ls run/plugins/Spyglass/dumps/*.txt >/dev/null 2>&1; then
            echo "::error::MISSING: the dump file itself"
            fail=1
          else
            echo "ok: the dump file is on disk"
            echo "--- dump head ---"
            head -n 40 run/plugins/Spyglass/dumps/*.txt || true
          fi
          if grep -nE "Error occurred while enabling Spyglass|Could not load .plugins.*Spyglass|NoClassDefFoundError|NoSuchMethodError|NoSuchFieldError|IncompatibleClassChangeError|Exception while enabling" "$LOG"; then
            echo "::error::linkage or enable error found in server log"
            fail=1
          fi
          # An unhandled exception inside the command would show up here.
          if grep -nE "Unhandled exception executing command 'spy'|error occurred while executing command" "$LOG"; then
            echo "::error::a /spy command threw"
            fail=1
          fi
          exit $fail
      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spyglass-server-log
          path: run/server.log
          if-no-files-found: warn
