name: Release Spyglass

# Two ways in, both landing on the same publish step.
#
#   1. Push a tag — the normal path once this is on the default branch:
#        git tag -a spyglass-v1.0.0 -m "Spyglass 1.0.0"
#        git push origin spyglass-v1.0.0
#
#   2. Push the branch with a version the repository hasn't released yet. The
#      job creates the tag itself, at the commit it built. This is what makes a
#      release possible from an environment that can push branches but not tags.
#
# Either way the version of record is spyglass/pom.xml, the tag is
# spyglass-v<that>, and a version that is already released is skipped rather
# than rebuilt. The tag is scoped because a bare vX.Y.Z in this repository
# already means CustomAchievements.
#
# The notes are assembled per version: an evergreen top and tail around this
# version's section of spyglass/CHANGELOG.md. No entry, no release — a version
# worth cutting is worth a paragraph saying what is in it.
#
# A published page whose notes no longer match the changelog is rewritten in
# place on the next run, so correcting the changelog is enough to correct the
# release. That path only ever changes text; the jar and the tag stay as they
# were shipped.

on:
  push:
    tags: [ "spyglass-v*" ]
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # The pom is the version of record. A tag that disagrees with it would
      # ship a jar whose own version contradicts its release page, so that is a
      # hard failure rather than a guess about which one was meant.
      - name: Resolve the version
        id: v
        working-directory: spyglass
        run: |
          set -euo pipefail
          POM=$(mvn -B -ntp -q help:evaluate -Dexpression=project.version -DforceStdout)
          echo "spyglass/pom.xml says: $POM"

          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#spyglass-v}"
            if [ "$VERSION" != "$POM" ]; then
              echo "::error::tag $TAG claims $VERSION but the pom says $POM"
              exit 1
            fi
          else
            VERSION="$POM"
            TAG="spyglass-v$VERSION"
          fi

          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Target release: $TAG"

      # What actually changed comes from spyglass/CHANGELOG.md, so a release
      # page describes its own version rather than repeating a feature list
      # written for 1.0.0. Missing entry is a hard failure: a version worth
      # cutting is a version worth a paragraph.
      #
      # Read before the release is looked up, so a missing entry fails in
      # seconds rather than after a full build.
      - name: Read this version's changelog entry
        run: |
          set -euo pipefail
          VERSION="${{ steps.v.outputs.version }}"
          awk -v want="$VERSION" '
            /^## / {
              # "## 1.0.0" or "## 1.0.0 — anything"
              heading = $2
              inside = (heading == want)
              next
            }
            inside { print }
          ' spyglass/CHANGELOG.md > entry.md

          # Trim leading and trailing blank lines.
          sed -i -e '/./,$!d' entry.md
          while [ -s entry.md ] && [ -z "$(tail -n1 entry.md)" ]; do
            sed -i '$d' entry.md
          done

          if [ ! -s entry.md ]; then
            echo "::error::spyglass/CHANGELOG.md has no '## $VERSION' section. Add one before bumping the pom."
            exit 1
          fi
          echo "--- changelog entry for $VERSION ---"; cat entry.md

      - name: Write the release notes
        run: |
          set -euo pipefail
          cat > notes.md <<'HEAD'
          **Read any player's data from the server console** — on a **Paper 1.21.4**
          server, whether they are logged in or not.

          Every other way to look at a player's data assumes you are *in the game*:
          open their inventory, stand where they stand, read a GUI. From the console
          you get nothing. Spyglass is the other way round — the console is the
          first-class audience, and everything is aligned plain text meant to be read
          in a terminal and grepped out of a log.

          ## What's new in __VERSION__

          HEAD

          cat entry.md >> notes.md

          cat >> notes.md <<'TAIL'

          ---

          ### Install

          Drop the jar in `plugins/` and restart. No dependencies. Then type `/spy` in
          the console, or `/spy sections` for everything it can show you.

          Full documentation: **[the README](https://github.com/Diamend-box/box/blob/__TAG__/spyglass/README.md)**.
          Every version's changes: **[the changelog](https://github.com/Diamend-box/box/blob/__TAG__/spyglass/CHANGELOG.md)**.

          ### What the plugin is

          - **Both halves of "any player".** A live player is read off the server
            objects; one who logged off three weeks ago is read out of
            `playerdata/<uuid>.dat` and the stats and advancements files beside it.
            The same command, the same sections, the same filters either way.
          - **Written for a terminal.** Aligned plain text, a page size you set, a
            filter on every long section, and `/spy dump` when the console scrolls.
          - **The raw save tree**, whole or one branch, with an online player saved
            first so what you read is current.
          - **A search that looks inside things.** Shulker boxes and bundles, four
            levels down, online or on disk — including across every save the server
            has, bounded by a file count and a time budget.
          - **A live tail.** `/spy watch` reports what someone does as they do it, by
            category, rate-limited so a fight cannot outrun the console, and
            optionally to a per-player log file.
          - **A diff.** Every dump is also written as JSON, so `/spy diff` can say
            what changed since one — matched by label, with the fields that always
            move counted rather than listed.

          ### Requirements

          Paper 1.21.4 and Java 21. No dependencies.

          ### It never writes to a player

          No editing inventories, no setting health, no moving anyone. The only write
          it ever asks for is Bukkit's own `Player#saveData()` before reading raw NBT,
          so the tree you read is current rather than as old as the last autosave.

          ### Verified

          Every release is built by CI, which runs the unit suites and then boots a
          real headless Paper 1.21.4 server and drives `/spy` from an actual console.
          The offline half is checked against a save file written by a separate Python
          script from Mojang's format — not by the plugin's own writer — so the
          assertions cannot pass merely because the reader and the writer agree with
          each other.

          **Worth knowing anyway:** reading `playerdata` means parsing a format Mojang
          can change. It is tested against 1.21.4 and copes with the older pre-1.20.5
          item layout, but a future version could still move something. Nothing here
          writes to a player, so the worst case is a field reading `n/a`.
          TAIL

          # Point the docs links at the tagged commit, so they resolve whether or
          # not this branch has reached the default branch yet.
          sed -i "s|__TAG__|${{ steps.v.outputs.tag }}|g" notes.md
          sed -i "s|__VERSION__|${{ steps.v.outputs.version }}|g" notes.md
          echo "--- notes.md ---"; cat notes.md

      # Idempotence: pushing the branch again must not rebuild or overwrite a
      # release that already exists. Bump the pom to cut a new one.
      #
      # The exception is the notes themselves. Those are generated from a file
      # in the repository, so the published page can fall behind a correction
      # to the changelog — and a release page that contradicts the changelog is
      # the failure this whole arrangement exists to prevent. When the text
      # differs it is rewritten in place. The tag, the commit and the jar are
      # never touched by that path.
      - name: Has this version already been released?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.v.outputs.tag }}"

          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "refresh=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "publish=false" >> "$GITHUB_OUTPUT"

          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body > published.md

          # GitHub hands the body back with CRLF line endings. Compare the text
          # itself — not line endings, trailing spaces, or blank lines at either
          # end — so the notes aren't rewritten over nothing on every push.
          normalise() {
            local text
            text=$(tr -d '\r' < "$1" | sed -e 's/[[:space:]]*$//' -e '/./,$!d')
            printf '%s\n' "$text"
          }
          normalise published.md > a.txt
          normalise notes.md     > b.txt

          if diff -q a.txt b.txt >/dev/null; then
            echo "refresh=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$TAG is already released and its notes are current — nothing to do."
          else
            echo "refresh=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$TAG is already released but its notes are out of date — rewriting them."
            diff a.txt b.txt || true
          fi

      # Tests run here on purpose: nothing gets a download link without passing
      # them first.
      - name: Build and test
        if: steps.check.outputs.publish == 'true'
        working-directory: spyglass
        run: mvn -B -ntp clean package

      - name: Name the jar
        id: jar
        if: steps.check.outputs.publish == 'true'
        run: |
          set -euo pipefail
          JAR=$(ls spyglass/target/Spyglass-*.jar | grep -v -- '-sources\|-javadoc' | head -n1)
          [ -n "$JAR" ] || { echo "::error::no jar was produced"; exit 1; }
          echo "path=$JAR" >> "$GITHUB_OUTPUT"
          ls -la "$JAR"

      # --target is what lets this create the tag: on a branch build the tag
      # does not exist yet, and gh cuts it at the commit that was just built.
      - name: Publish the release
        if: steps.check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.v.outputs.tag }}" "${{ steps.jar.outputs.path }}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Spyglass ${{ steps.v.outputs.version }}" \
            --notes-file notes.md
          gh release view "${{ steps.v.outputs.tag }}" --repo "$GITHUB_REPOSITORY"

      # Prose-only correction to a release that already shipped, so the page
      # never contradicts the changelog it was generated from.
      - name: Bring an existing release's notes up to date
        if: steps.check.outputs.refresh == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit "${{ steps.v.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file notes.md
          echo "::notice::Rewrote the notes on ${{ steps.v.outputs.tag }}."
