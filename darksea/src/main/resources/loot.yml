      - { type: item, material: ENCHANTED_GOLDEN_APPLE, min: 1, max: 1, weight: 4 }
      - { type: custom, id: gillwater_philter,    weight: 4 }
      - { type: custom, id: tidal_draught,        weight: 4 }
      # treasure
      - { type: custom, id: relic_naxome_heart,   weight: 1 }
      - { type: custom, id: order_ceremonial_blade, weight: 2 }
      - { type: armor, tier: 4, weight: 8 }
      - { type: token, level: 3, weight: 3 }
      - { type: token, level: 4, weight: 2 }
      - { type: token, level: 5, weight: 1 }
      - { type: custom, id: hullpiercer_arrow,    min: 4, max: 8, weight: 4 }
      - { type: custom, id: harpoon_gun,          weight: 2 }
    vault:
      rolls: 7
      entries:
        - { type: custom, id: chronon,            min: 26, max: 44, weight: 12 }
        - { type: item, material: NETHERITE_INGOT, min: 1, max: 1, weight: 4 }
        - { type: custom, id: harpoon_gun,        weight: 4 }
        - { type: item, material: ENCHANTED_GOLDEN_APPLE, min: 1, max: 2, weight: 5 }
        - { type: custom, id: relic_monolith_splinter, weight: 1 }
        - { type: custom, id: relic_naxome_heart, weight: 1 }
        - { type: custom, id: order_ceremonial_blade, weight: 4 }
        - { type: armor, tier: 4, weight: 10 }
        - { type: token, level: 3, weight: 6 }
        - { type: token, level: 4, weight: 4 }
        - { type: token, level: 5, weight: 2 }
  # ── The Sunless Trench — the Order's breeding water ──
  # Ring 5 builds only a couple of islands, and nothing survives out here
  # without full tier-4 plate and a shielded hull. The tables pay for that:
  # the fattest Chronon piles in the sea, netherite by the ingot, and the
  # only chests that hand out a level-5 token with any regularity. There is
  # no tier-5 armor to progress into — the Leviathan set is the ceiling — so
  # the Trench pays in coin, hulls and consumables instead of in plate.
