      - { type: item, material: AMETHYST_SHARD,   min: 4, max: 10, weight: 10 }
      - { type: item, material: GOLDEN_APPLE,     min: 1, max: 3, weight: 8 }
      - { type: custom, id: deepsight_tonic,      weight: 4 }
      - { type: custom, id: gillwater_philter,    weight: 4 }
      - { type: custom, id: tidal_draught,        weight: 4 }
      # treasure
      - { type: custom, id: relic_mariphage_sample, weight: 1 }
      - { type: custom, id: harborguard_pike,     weight: 2 }
      - { type: custom, id: order_ceremonial_blade, weight: 1 }
      - { type: armor, tier: 3, weight: 8 }
      - { type: armor, tier: 4, weight: 1 }
      - { type: token, level: 2, weight: 2 }
      - { type: token, level: 3, weight: 2 }
      - { type: token, level: 4, weight: 1 }
      - { type: custom, id: chainshot_arrow,      min: 6, max: 10, weight: 3 }
      - { type: custom, id: hullpiercer_arrow,    min: 3, max: 6, weight: 3 }
    vault:
      rolls: 7
      entries:
        - { type: custom, id: chronon,            min: 20, max: 32, weight: 12 }
        - { type: item, material: DIAMOND_BLOCK,  min: 1, max: 1, weight: 6 }
        - { type: custom, id: deepsight_tonic,    weight: 5 }
        - { type: custom, id: gillwater_philter,  weight: 5 }
        - { type: custom, id: relic_mariphage_sample, weight: 2 }
        - { type: custom, id: order_ceremonial_blade, weight: 4 }
        - { type: armor, tier: 3, weight: 10 }
        - { type: armor, tier: 4, weight: 2 }
        - { type: token, level: 3, weight: 5 }
        - { type: custom, id: harpoon_gun,        weight: 3 }
  # ── The Abyssal Reaches — the monolith's own hoard ──
  4:
    rolls: 5
    refill-cooldown-minutes: 120
    entries:
      # junk
      - { type: item, material: CANDLE,           min: 2, max: 5, weight: 6,
          name: '<dark_purple>Vigil Candle</dark_purple>',
