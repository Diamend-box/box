# ---------------------------------------------------------------------------
# DarkSea — loot tables per island tier (Loot 2.0)
#
# Each registered island chest refills 'rolls' random entries when opened, if
# 'refill-cooldown-minutes' has passed since its last refill (timestamps
# persist in islands.yml).
#
# Entry types:
#   item   — vanilla material + amount range (min..max). Optional 'name' and
#            'lore' (MiniMessage) make it flavor salvage — junk with a story.
#   armor  — a random sea-armor piece of the given tier (the progression
#            engine: ring N chests drop tier N, with a small chance of N+1)
#   token  — a boat upgrade token for the given level
#   custom — a registry item by id (Chronons, relics, weapons, consumables).
#            Identity is PDC-tagged, so relics can't be faked and a typo'd id
#            fails CI instead of shipping. Ids live in DarkSeaItems.
#
# CHRONONS — the Naxome's currency — drop in every ring, growing with depth.
# Some islands were rich once: each island carries a hidden wealth multiplier
# (0.6x–1.8x, derived from its position) applied to its Chronon piles only.
# The refugees at the calm center take Chronons to wake relics (/ds relic
# revive), and the outpost's five shopkeepers all deal in the same coin.
#
# RELICS drop dormant (collectibles). Revived at the calm center they grant
# a PERMANENT passive boost from your inventory — at most 'relics.max-active'
# at once — so they are deliberately the rarest thing in any table: roughly
# one chest in twenty-five, one vault in five. They were an order of
# magnitude commoner than that until the second live test said so.
# The junk-band named items (Rotted Rigging...) are salvage, not relics.
#
# VAULT — islands with two or more chests (tier 3 hides two, tier 4 three)
# elect ONE deterministic vault chest that rolls the tier's 'vault' table
# instead: more rolls, fatter Chronon piles, better odds on relics, armor
# and weapons. Single-chest islands never have a vault.
#
# Every tier is banded: JUNK (flavor salvage, common), GOODS (materials and
# consumables, the bread and butter), TREASURE (relics, armor, tokens,
# weapons — rare). Chest weapons are deliberately a notch under what the
# cursed themselves drop; the good stuff walks and fights back.
# Reloads with /ds reload.
# ---------------------------------------------------------------------------

tiers:
  # ── The Wild Sea — wrecks of those who sailed in and didn't sail out ──
  1:
    rolls: 4
    refill-cooldown-minutes: 45
    entries:
      # junk
      - { type: item, material: STRING,           min: 2, max: 5, weight: 10,
          name: '<gray>Rotted Rigging</gray>',
          lore: ['<dark_gray>Cut from a sail nobody trims anymore.</dark_gray>'] }
      - { type: item, material: COOKED_COD,       min: 3, max: 8, weight: 12 }
      # goods
      - { type: custom, id: chronon,              min: 3, max: 6, weight: 14 }
      - { type: item, material: IRON_INGOT,       min: 2, max: 6, weight: 16 }
      - { type: item, material: EMERALD,          min: 1, max: 3, weight: 9 }
      - { type: item, material: EXPERIENCE_BOTTLE, min: 2, max: 5, weight: 9 }
      - { type: custom, id: sea_salve,            weight: 6 }
      # treasure
      - { type: custom, id: relic_trade_coin,     weight: 1 }
      - { type: custom, id: naxian_boarding_axe,  weight: 2 }
      - { type: armor, tier: 1, weight: 8 }
      - { type: armor, tier: 2, weight: 1 }
      - { type: token, level: 1, weight: 3 }
      - { type: custom, id: chainshot_arrow,      min: 4, max: 8, weight: 4 }
    vault:
      rolls: 6
      entries:
        - { type: custom, id: chronon,             min: 10, max: 18, weight: 12 }
        - { type: item, material: IRON_BLOCK,      min: 1, max: 2, weight: 8 }
        - { type: item, material: GOLDEN_APPLE,    min: 1, max: 2, weight: 6 }
        - { type: custom, id: sea_salve,           weight: 6 }
        - { type: custom, id: tidal_draught,       weight: 5 }
        - { type: custom, id: relic_trade_coin,    weight: 2 }
        - { type: custom, id: naxian_boarding_axe, weight: 5 }
        - { type: armor, tier: 1, weight: 10 }
        - { type: armor, tier: 2, weight: 2 }
        - { type: token, level: 1, weight: 6 }
  # ── The Raging Deep — the Naxome's drowned towns ──
  2:
    rolls: 4
    refill-cooldown-minutes: 60
    entries:
      # junk
      - { type: item, material: BONE,             min: 2, max: 6, weight: 8,
          name: '<gray>Unclaimed Remains</gray>',
