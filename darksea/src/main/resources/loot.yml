      - { type: custom, id: chronon,              min: 5, max: 9, weight: 14 }
      - { type: item, material: GOLD_INGOT,       min: 2, max: 6, weight: 14 }
      - { type: item, material: DIAMOND,          min: 1, max: 2, weight: 8 }
      - { type: item, material: GOLDEN_APPLE,     min: 1, max: 2, weight: 7 }
      - { type: item, material: EXPERIENCE_BOTTLE, min: 4, max: 8, weight: 9 }
      - { type: custom, id: sea_salve,            weight: 5 }
      - { type: custom, id: tidal_draught,        weight: 5 }
      # treasure
      - { type: custom, id: relic_harbor_bell,    weight: 1 }
      - { type: custom, id: naxian_boarding_axe,  weight: 2 }
      - { type: custom, id: harborguard_pike,     weight: 2 }
      - { type: armor, tier: 2, weight: 8 }
      - { type: armor, tier: 3, weight: 1 }
      - { type: token, level: 1, weight: 2 }
      - { type: token, level: 2, weight: 3 }
      - { type: custom, id: chainshot_arrow,      min: 4, max: 8, weight: 4 }
      - { type: custom, id: hullpiercer_arrow,    min: 2, max: 4, weight: 2 }
    vault:
      rolls: 6
      entries:
        - { type: custom, id: chronon,            min: 14, max: 24, weight: 12 }
        - { type: item, material: DIAMOND,        min: 2, max: 4, weight: 8 }
        - { type: item, material: GOLDEN_APPLE,   min: 2, max: 3, weight: 6 }
        - { type: custom, id: tidal_draught,      weight: 6 }
        - { type: custom, id: relic_harbor_bell,  weight: 2 }
        - { type: custom, id: harborguard_pike,   weight: 5 }
        - { type: armor, tier: 2, weight: 10 }
        - { type: armor, tier: 3, weight: 2 }
        - { type: token, level: 2, weight: 6 }
        - { type: custom, id: hullpiercer_arrow,  min: 3, max: 6, weight: 4 }
  # ── The Midnight Waters — where the Order works openly ──
  3:
    rolls: 5
