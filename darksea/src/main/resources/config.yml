  boat-debug-none: "<red>Sit in a Dark Sea boat first — /ds boat damage hits the boat you're in."
  boat-debug-damaged: "<gray>Debug: dealt <red>{amount}</red> hull damage — hull now <aqua>{hp}</aqua>/<aqua>{max}</aqua>."
  boat-debug-sunk: "<gray>Debug: that sank the boat."

  naval-surge: "<aqua>Surge!"
  naval-surge-cooldown: "<gray>Surge ready in {seconds}s."
  naval-sunk-them: "<green>You sank their boat!"
  naval-chainshot-hit: "<red>Chainshot! Your hull is crippled."
  naval-hooked: "<red>You've been harpooned — surge to snap the line!"
  naval-hooked-them: "<green>Harpoon set — reel them in!"
  naval-line-snapped: "<yellow>You snap the harpoon line free."
  naval-line-snapped-them: "<red>They snapped your harpoon line!"

  island-list-header: "<dark_aqua>Islands ({count}):"
  island-list-entry: "<gray>{id} <white>{template}</white> tier {tier} @ {x}, {z}"
  island-not-found: "<red>No island with id {id}."
  island-tp: "<green>Teleported to island {id}."

  reload-done: "<green>Configuration reloaded. (World shape and task intervals need a restart.)"

  help-header: "<dark_aqua><bold>DarkSea commands</bold>"
  help-line: "<gray>{usage} <dark_gray>— {description}"
