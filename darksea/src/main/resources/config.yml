  boat-repair-away: "<red>You can only repair at the home island — sail back to dock."
  boat-repair-need-chronons: "<red>Repairs cost <aqua>{cost} Chronons</aqua> — you carry {have}."
  boat-wreck-recovered: "<red>Your boat is wrecked and you're cast adrift — you salvage the hull. Rebuild it at the home island to sail again."
