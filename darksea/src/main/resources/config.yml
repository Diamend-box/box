# ---------------------------------------------------------------------------
# DarkSea — main configuration
#
# World shape (world.*) and task intervals are read once at startup; everything
# else (zones, armor names, generation counts, boat stats, messages) reloads
# with /ds reload.
# ---------------------------------------------------------------------------

world:
  name: dark_sea

  # The caves past the cultist-origin island: a separate world, generated by
  # the plugin, playing by ordinary rules — no exposure, no armor gate, no
  # boats. Ore veins live there and nothing else in it is mineable.
  caves:
    name: dark_sea_caves
    floor-y: 20         # bedrock sits below this; nothing is open at or under it
    roof-y: 90          # solid roof above this, so there is no sky
    half-extent: 256    # half the width — 256 gives a 512x512 box
    chamber-radius: 6   # the guaranteed-open room the portal arrives in

  # The one cultist landfall, offset from the calm center. There is exactly
  # one in the world and it never moves — it is the only way down into the
  # caves. Far enough out that reaching it needs a real boat and real armor.
  landfall:
    offset-x: 2600
    offset-z: -1800
  sea-level: 62
  seabed:
    base-y: 45        # average ocean-floor height
    variation: 5      # +/- noise variation around base-y

# The point every distance is measured from (the home island).
center:
  x: 0
  z: 0

exposure:
  check-interval-ticks: 20     # one exposure pass per second
  effect-duration-ticks: 60    # effects re-applied each pass; lapse ~2s after leaving
  grace-on-login-seconds: 10   # no effects right after logging in

# Concentric danger rings, measured from center. Order them by max-radius,
# with the outermost ring using max-radius -1 (unbounded).
# required-tier is the sea-armor tier that fully negates the ring.
# Effect types are Minecraft potion-effect keys (poison, wither, darkness...).
zones:
  - id: safe
    name: "<green>Calm Waters</green>"
    max-radius: 500
    required-tier: 0
    effects: []
  - id: zone1
    name: "<yellow>The Wild Sea</yellow>"
    max-radius: 1500
    required-tier: 1
    effects:
      - type: poison
        amplifier: 0
  - id: zone2
    name: "<gold>The Raging Deep</gold>"
    max-radius: 3000
    required-tier: 2
    effects:
      - type: poison
        amplifier: 1
      - type: weakness
        amplifier: 0
  - id: zone3
    name: "<red>The Midnight Waters</red>"
    max-radius: 5000
    required-tier: 3
    effects:
      - type: wither
        amplifier: 0
      - type: darkness
        amplifier: 0
  - id: zone4
    name: "<dark_purple>The Abyssal Reaches</dark_purple>"
    # Stretched out so the tier-5 Trench begins ~14,500 blocks from center: a
    # maxed Maelstrom (16.2 b/s) needs ~15 min just to reach ring 5, and the
    # whole approach is tier-4 danger — you cross it in full kit or not at all.
    max-radius: 14500
    required-tier: 4
    effects:
      - type: wither
        amplifier: 1
      - type: slowness
        amplifier: 1
  # Tier 5: survivable ONLY with the best kit. Tier-4 armor + a shield-2 boat
  # (protection 6) fully negates it (5-4-2 < 0); tier-4 armor alone leaves you
  # stung. No islands out here — it's the approach gauntlet to the rim.
  - id: zone5
    name: "<dark_red>The Sunless Trench</dark_red>"
    # Ends ~24,500 from center, where the Devouring Rim begins: ~25 min out at
    # top boat speed. The Trench itself is a ~10,000-block crossing.
    max-radius: 24500
    required-tier: 5
    effects:
      - type: wither
        amplifier: 2
      - type: weakness
        amplifier: 1
      - type: slowness
        amplifier: 1
      # The Sunless Trench earns its name: perpetual darkness on top of a
      # deeper wither than the Reaches. Still gear-reducible — armor matters,
      # but tier-4 kit that walked the Reaches will struggle out here.
      - type: darkness
        amplifier: 0
  # Tier 6: the lethal rim. bypass-protection means armor AND shield are
  # ignored — its full effects land on everyone, no matter the gear. The wither
  # is the killer (it ignores armor), so the only way across is to out-heal it
  # with stacks of golden/enchanted apples, bleeding the whole way. Whatever is
  # out here is bait: reachable in theory, almost never in practice.
  - id: zone6
    name: "<dark_red>The Devouring Rim</dark_red>"
    max-radius: -1
    required-tier: 6
    bypass-protection: true
    effects:
      - type: wither
        amplifier: 2
      - type: darkness
        amplifier: 0
      - type: slowness
        amplifier: 2
      - type: weakness
        amplifier: 1

# Sea armor sets. Tier = the ring it fully protects against. Wearing a full
# set of tier N counts as protection N; the LOWEST tier among the four worn
# pieces is what counts (an untagged or missing piece counts as 0).
armor:
  unbreakable: true
  tiers:
    1:
      name: "<color:#6ecff6>Tidewalker</color>"
      material: CHAINMAIL
    2:
      name: "<color:#a8b6c0>Stormplate</color>"
      material: IRON
    3:
      name: "<color:#7e57c2>Abyssal</color>"
      material: DIAMOND
    4:
      name: "<color:#26c6da>Leviathan</color>"
      material: NETHERITE

# Island scattering (/ds generate and /ds reset full).
generation:
  # No schematics yet? Leave this true and any tier without a .schem pool gets a
  # simple built-in sand-platform island (one loot chest + one mob spawn point)
  # so you can test generation, loot, mobs and resets with zero building. Real
  # schematics always take precedence per tier. Set false once you've added your
  # own builds (see schematics/ in the docs).
  demo-islands: true
  # Ticks between demo-island builds. Each island forces new ocean chunks to
  # generate, and that is what strains a small host — raise this on 1-2GB
  # servers if /ds generate causes lag (20 = one island per second).
  demo-pace-ticks: 10
  paste-y: 58                # clipboard origin lands at this Y (sidecars can override)
  min-island-gap: 400        # minimum distance between any two islands
  ring-border-margin: 200    # keep islands this far inside their ring's borders
  outer-radius: 6000         # practical outer limit for the unbounded outermost ring
  # Defaults sized for small shared hosts (1-2GB). On a beefier server the
  # sea carries more: try 12/16/16/20 with outer-radius 8000.
  islands-per-ring:
    1: 6
    2: 8
    3: 8
    4: 10
    # The Sunless Trench (tier 5, ~14,500-24,500 out) builds only a couple of
    # islands. About half are Mariphage nests (guaranteed Core); the rest are
    # rare drowned castles and dead volcanoes, the only non-nest Core path out
    # here and a denser fight. Keep this low; each nest garrisons a warden. The
    # Devouring Rim (tier 6) stays island-free by design.
    5: 2

# Marker blocks scanned inside pasted schematics (then replaced):
#   chest      -> becomes a registered, refilling loot chest
#   mob-spawn  -> removed; becomes a MythicMobs spawn point
markers:
  chest: LODESTONE
  mob-spawn: GOLD_BLOCK

mob-spawning:
  scan-interval-ticks: 100      # how often islands are checked for nearby players
  activation-radius: 64         # a player within this range activates an island
  per-island-cap: 6
  global-cap: 120
  abandon-cooldown-minutes: 5   # despawn island mobs after this long with nobody near

# Timed sea reset. The whole Dark Sea resets on a cycle so loot can't be
# hoarded or camp-farmed forever — a countdown warns players, then the sea
# heals and restocks. Players out in the sea are washed home to the sanctuary
# first, so a reset never buries anyone. (You can always reset by hand with
# /ds reset soft|full.)
reset:
  auto:
    enabled: true
    interval-hours: 6        # reset every N hours (from server start / last reset)
    # soft = heal islands and restock chests in place, positions kept (light).
    # full = brand-new world layout each cycle (heavy — a "season" wipe).
    mode: soft
    warn-minutes: [30, 10, 5, 1]   # broadcast a countdown at each of these

# Boxpvp guard rails.
combat:
  # Generated islands are protected loot-content: players can't break, build on,
  # bucket-grief or blow up island blocks — only the chests open. The island is
  # the contested prize, not a mine. Admins (darksea.admin) bypass, so the
  # hand-built home island stays editable. Set false to let islands be raided
  # block-by-block instead.
  protect-islands: true
  # Extend that protection this many blocks past each island's edge (and up the
  # whole column), so players can't pillar up right alongside an island to
  # snipe its mobs from out of reach. 0 = protect only the island's footprint.
  island-protect-buffer: 5
  # Run-scoped death (the extraction loop). Dying in the Dark Sea drops only
  # what you gathered this run — chest loot and mob drops — never the gear you
  # sailed out with (that's kept and handed back on respawn). Returning to the
  # calm-water sanctuary BANKS your haul: the mark is cleared and it's yours to
  # keep for good. So killing someone takes their unbanked haul, not their kit —
  # rewarding without being ruinous. Set false for plain vanilla death.
  run-loot-death: true
  # PvP is on across the whole Dark Sea EXCEPT within this radius of center —
  # the home island's sanctuary, where nobody can be struck or grief a block.
  # PvP itself rides your server.properties `pvp` flag (leave it true); this
  # only carves out the safe home waters. Shrink it to hug just your spawn
  # island, or set 0 to make the entire sea PvP. (Defaults to the Calm Waters
  # ring so spawn is safe out of the box.)
  pvp-safe-radius: 500

# Naxome relics: dormant when looted, revived by the refugees at the calm
# center (/ds relic revive, paid in Chronons). A revived relic works from
# anywhere in your inventory; this caps how many work at once.
relics:
  max-active: 2
  # The Undrowned Heart: the apex reward hidden past the Devouring Rim. It is
  # attuned once (right-click, consumed for good) and then, once every
  # cooldown-seconds, refuses a lethal blow like a Totem of Undying — clearing
  # effects and leaving the captain at revive-health with a totem's buffs. The
  # cooldown is stamped into player data, so relogging can't reset it.
  undrowned:
    cooldown-seconds: 150
    revive-health: 1.0

boat:
  # Hard ceiling on boat speed: cap = speed-cap-base * level speed multiplier
  # (blocks per tick of horizontal velocity). Tune in playtesting.
  speed-cap-base: 0.45
  # Custom stat points: a captain earns ONE point per boat level (so a maxed
  # level-5 hull has 5 to spend) and allocates them from the boat wheel's
  # Outfit page into any of four stats. Each value below is what one point adds;
  # reset-cost-per-point is the Chronon price to respec, times the number of
  # points currently committed (so undoing a full 5-point build costs more).
  stat-points:
    speed-per-point: 0.03        # +3% top speed per point (kept small — chase safety)
    toughness-per-point: 0.15    # +0.15 damage divisor per point
    hp-per-point: 2.0            # +2 hull HP per point
    ram-power-per-point: 0.10    # +0.10x ram damage dealt per point
    reset-cost-per-point: 8
  # speed  = velocity multiplier while sailing the Dark Sea
  # shield = exposure protection (scout one ring farther per point)
  # toughness = divisor on incoming hull damage in PvP — a higher boat takes
  #   more hits before it's sunk, so upgrading buys survivability at sea, not
  #   just pace. Deliberately flattened (Wyatt: weaker ships shouldn't be
  #   hopeless): toughness and hp MULTIPLY into effective HP, so a steep
  #   toughness curve on top of bigger hulls made apex boats near-unkillable.
  #   At this curve a Maelstrom is ~5.8x a Rowboat's effective HP, not 12x.
  # hp = the tier's own hull max HP. 0 (or omitted) means "use the global
  #   naval.hull.max-hp" (10); each level from the Sloop up carries a slightly
  #   bigger hull (11/13/14/18/24) so every upgrade soaks both harder
  #   (toughness) AND longer (raw HP), a smooth ramp instead of a cliff at
  #   tier 3. Effective HP (hp x toughness): 10 / 13.75 / 19.5 / 25.2 / 37.8 /
  #   57.6 — a Maelstrom is ~5.8x a Rowboat, not 12x.
  # Ram Power (naval.ram.power-per-level, default 0.15) scales offense by
  #   level automatically: level 4 = 1.60x, level 5 = 1.75x.
  levels:
    0: { name: "Rowboat",     speed: 1.00, shield: 0, toughness: 1.0, hp: 0 }
    1: { name: "Sloop",       speed: 1.15, shield: 0, toughness: 1.25, hp: 11 }
    2: { name: "Cutter",      speed: 1.30, shield: 1, toughness: 1.5, hp: 13 }
    3: { name: "Stormrunner", speed: 1.45, shield: 1, toughness: 1.8, hp: 14 }
    4: { name: "Tempest",     speed: 1.55, shield: 2, toughness: 2.1, hp: 18 }
    5: { name: "Maelstrom",   speed: 1.65, shield: 2, toughness: 2.4, hp: 24 }

# Boat-vs-boat combat: rams, wounded hulls, the surge, naval ammo.
naval:
  # A collision counts as a ram above this closing speed (blocks/tick of
  # actual convergence — boats sailing in formation never trigger it).
  # Force = closing speed * damage-per-speed, capped. The defender's hull
  # eats defender-share of it, the rammer's hull the rest, each softened by
  # its own toughness; rider-bleed of each hull share also hits that rider.
  ram:
    min-closing-speed: 0.5
    damage-per-speed: 8.0
    max-damage: 10.0
    defender-share: 0.75
    rider-bleed: 0.3
    knockback: 0.8
    pair-cooldown-millis: 1500
    # Ram power: the attacker's charge lands harder per boat level (linear off
    # 1.0), boosting only the hull damage it DEALS — the share bouncing back onto
    # the rammer is unaffected. At 0.15: Rowboat 1.00x, Sloop 1.15x, Cutter
    # 1.30x, Stormrunner 1.45x, Tempest 1.60x, Maelstrom 1.75x. A maxed hull is
    # both the tank and the battering ram, but this only helps one hit, so a
    # low-tier swarm still wins.
    power-per-level: 0.15
  # Naval weapons run on their own hull HP (vanilla whacking keeps vanilla
  # wobble + toughness). Any hull hit — including plain arrows — slows the
  # boat to wounded-speed-factor for wounded-slow-seconds, so a max-speed
  # runner can always be chipped and caught.
  hull:
    max-hp: 10.0
    # Any naval hit combat-tags the hull: no healing at all for this long.
    combat-tag-seconds: 60
    # After the tag lapses the hull claws back this much HP per second (it
    # does NOT snap to full) — 0.5 = one pip every two seconds.
    regen-per-second: 0.5
    wounded-slow-seconds: 4
    wounded-speed-factor: 0.7
    # On top of that momentary post-hit dip, every point of HP the hull is
    # missing shaves this fraction off the top speed until it's repaired or
    # regenerates: 0.05 = 5% per pip, so a 10-HP hull down to 4 HP cruises at
    # 70% and at 1 HP crawls at 55%. Floored internally at 15% so a battered
    # hull can always limp home.
    speed-penalty-per-hp: 0.05
  # The home dry-dock, reached from the boat wheel (sneak-right-click your
  # boat, or /ds boat). A wounded hull is patched straight back to full for
  # cost-per-hp Chronons per missing HP — but ONLY inside the home sanctuary
  # (combat.pvp-safe-radius), so a captain has to sail all the way home to it.
  repair:
    cost-per-hp: 2.0
  # Tap sprint or jump at the tiller: a burst to boost-factor * the speed
  # cap, then the cooldown. Surging while harpooned snaps the line instead.
  surge:
    boost-factor: 1.8
    cooldown-seconds: 9
  # Chainshot arrow: barely dents, brutally slows.
  chainshot:
    slow-seconds: 6
    speed-factor: 0.5
  # Hullpiercer arrow: the rare boat-killer. Heavy hull damage that shrugs off
  # most of the plating — only toughness-factor of the target's toughness BONUS
  # (the part above 1.0) still counts, so a fat toughness curve barely helps.
  # At damage 9.0 / factor 0.25 it sinks a Maelstrom (24 hull, tough 2.4) in ~4
  # hits instead of ~7; against a Rowboat it's a flat ~9. Worth its rarity.
  hullpiercer:
    damage: 9.0
    toughness-factor: 0.25
  # Harpoon gun: hooks a ridden boat in range and reels it toward the shooter.
  harpoon:
    range: 24
    pull-seconds: 2.0
    pull-strength: 0.35
  # The always-on boat action bar: hull pips, wounded flag, surge state.
  # Repainted every period-ticks while riding a boat in the Dark Sea.
  hud:
    enabled: true
    period-ticks: 10

# All messages use MiniMessage. {placeholders} are filled in by the plugin.
messages:
  prefix: "<dark_aqua>[DarkSea]</dark_aqua> "
  no-permission: "<red>You don't have permission to do that."
  players-only: "<red>That subcommand is for players."
  unknown-command: "<red>Unknown subcommand. Try <white>/ds help</white>."
  world-missing: "<red>The Dark Sea world is not loaded."
  player-not-found: "<red>Player {player} is not online."
  invalid-number: "<red>{value} is not a valid number."
  # Bounties (/ds bounty). Placed and claimed lines are broadcast to everyone.
  bounty-usage: "<gray>Usage: <white>/ds bounty <player> <amount></white> — spend Chronons to put a price on a head.</gray>"
  bounty-no-target: "<red>No online player named <white>{name}</white>.</red>"
  bounty-self: "<red>You can't put a bounty on your own head.</red>"
  bounty-bad-amount: "<red><white>{value}</white> isn't a positive number of Chronons.</red>"
  bounty-need-chronons: "<red>That bounty costs <aqua>{cost}</aqua> Chronons — you only have <aqua>{have}</aqua>.</red>"
  bounty-placed: "<gold>☠ <white>{sponsor}</white> put <aqua>{amount}</aqua> Chronons on <white>{target}</white>'s head — the bounty stands at <aqua>{total}</aqua>.</gold>"
  bounty-claimed: "<gold>☠ <white>{killer}</white> collected the <aqua>{amount}</aqua>-Chronon bounty on <white>{target}</white>!</gold>"
  bounty-none: "<gray>No bounties on any heads right now. Set one with <white>/ds bounty <player> <amount></white>.</gray>"
  bounty-list-header: "<gold>☠ Standing bounties</gold>"
  bounty-list-entry: "<gray>• <white>{name}</white> — <aqua>{amount}</aqua> Chronons</gray>"

  zone-crossed-protected: "<gray>Entering {zone}<gray> — your armor holds."
  zone-crossed-exposed: "<red>Entering {zone}<red> — you are not protected here!"
  zone-crossed-exempt: "<gray>Entering {zone}<gray> — <yellow>exempt<yellow> (creative/spectator/bypass)."

  status-header: "<dark_aqua><bold>Dark Sea status</bold>"
  status-zone: "<gray>Zone: {zone} <gray>({distance}m from center)"
  status-protection: "<gray>Sea armor tier: <aqua>{tier}</aqua>"
  status-boat: "<gray>Boat: <aqua>{name}</aqua> (level {level}, shield {shield})"
  status-safe: "<green>You are fully protected here."
  status-danger: "<red>Exposed! You suffer tier-{exposure} effects here."
  status-not-in-world: "<gray>You are not in the Dark Sea."

  tp-done: "<green>Teleported to the home island."

  run-loot-lost: "<red>You went down with {count} unbanked item(s) — your haul spills into the sea."
  run-loot-banked: "<green>Ashore and safe — {count} item(s) from your run are yours to keep."

  generate-started: "<green>Queued {count} island paste(s). Progress is reported as they land."
  generate-none: "<yellow>Nothing to generate — every ring is already at its configured island count."
  generate-busy: "<red>Island generation or a reset is already running — wait for it to finish."
  generate-bad-count: "<red>'{value}' is not a number — use /ds generate [count]."
  generate-no-templates: "<yellow>No schematics found for tier {tier} (schematics/tier{tier}/*.schem) — ring skipped."
  generate-shortfall: "<yellow>Ring {tier}: only found room for {placed} of {wanted} islands (spacing too tight?)."
  generate-progress: "<gray>Pasted <white>{id}</white> ({template}) at {x}, {z} — {remaining} to go."
  generate-done: "<green>Paste queue finished."
  paste-failed: "<red>Failed to paste {template}: {error} (see console)."
  spawn-schem-missing: "<yellow>No home-island schematic in schematics/spawn/ — drop a .schem there and run /ds generate."

  reset-cycle-warning: "<gold>The Dark Sea churns — the tides reset in {minutes} minute(s). Bank your haul at home!"
  reset-cycle-now: "<red><bold>The Dark Sea heaves</bold><red> — the tides reset. You're swept back to shore."
  reset-soft-started: "<green>Soft reset started — re-pasting the home island and {count} island(s) in place."
