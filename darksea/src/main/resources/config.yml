  boat-outfit-combat: "<red>Can't change your outfit in combat — wait for the tag to fade."

  # The Undrowned Heart.
  undrowned-attuned: "<gradient:#12d6df:#f0f9ff>The Undrowned Heart dissolves into you. The sea will not keep you now.</gradient>"
  undrowned-already: "<yellow>You are already undrowned."
  undrowned-saved: "<aqua>The Heart refuses your death — the sea spits you back."

  naval-surge: "<aqua>Surge!"
  naval-surge-cooldown: "<gray>Surge ready in {seconds}s."
  naval-sunk-them: "<green>You sank their boat!"
  naval-chainshot-hit: "<red>Chainshot! Your hull is crippled."
  naval-hooked: "<red>You've been harpooned — surge to snap the line!"
  naval-hooked-them: "<green>Harpoon set — reel them in!"
