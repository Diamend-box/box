# ---------------------------------------------------------------------------
# DarkSea — mob sets per island tier
#
# 'type' is tried as a MythicMobs INTERNAL name first (the id you'd use with
# /mm mobs spawn). The names below match the ready-to-copy pack in
# mythicmobs-pack/ — see its README. If MythicMobs isn't installed (or doesn't
# know the name), the entry's 'fallback' spawns as a VANILLA entity instead,
# so encounters work out of the box. Fallbacks were picked to survive
# daylight and dry land (which is why MutatedNaxian falls back to HUSK, not a
# burning zombie).
#
# A mob's tier is its MINIMUM ring. Lower-tier mobs also appear on deeper
# islands, with their weight multiplied by 'lower-tier-decay' once per ring
# below the island's tier: at 0.35, one ring down keeps ~35% of its weight,
# two rings ~12%, three rings ~4% — so a Crazed Sailor in the Abyssal Reaches
# is a rare stray, not a regular. Set 0 to restore strict per-tier sets.
#
# 'weight' picks between entries; 'level' is passed to MythicMobs (the
# shipped pack uses flat stats, so it's future headroom; vanilla fallbacks
# ignore it). Reloads with /ds reload.
# ---------------------------------------------------------------------------

lower-tier-decay: 0.35

# The story out here: the Naxome — the civilization whose ruins dot these
# islands — fell to the Mariphage, the curse-plague the Order of the Soul is
# reseeding from the abyssal monolith. The Cursed are its victims; the Order's
# ranks are its keepers, and their share of spawns grows ring by ring.
tiers:
  # ── The Wild Sea — the infection's outermost edge ──
  1:
    - { type: CrazedSailor,      fallback: HUSK,            weight: 10, level: 1 }
    - { type: VironicInitiate,   fallback: PILLAGER,        weight: 4,  level: 1 }
  # ── The Raging Deep — old Naxian towns, half-claimed ──
  2:
    - { type: MutatedNaxian,     fallback: HUSK,            weight: 9,  level: 3 }
    - { type: VironicAcolyte,    fallback: VINDICATOR,      weight: 5,  level: 3 }
  # ── The Midnight Waters — the curse runs bone-deep ──
  3:
    - { type: TransmutedNaxian,  fallback: WITHER_SKELETON, weight: 8,  level: 6 }
    - { type: VironicTemplar,    fallback: WITCH,           weight: 6,  level: 6 }
  # ── The Abyssal Reaches — the Order's seat of power ──
  # The Mariphage Core is NOT a native roaming pick: it is the resident boss
  # of the Mariphage nest island (a rare landmark out here, the norm in the
  # Sunless Trench), where the spawner keeps exactly one standing. It summons
  # its own Vessels; those never appear in this file. Its signature drops
  # (below) still fire wherever it dies, nest or not.
  4:
    - { type: NaxianAbomination, fallback: RAVAGER,         weight: 8,  level: 10 }
    - { type: VironicLord,       fallback: EVOKER,          weight: 6,  level: 10 }
  # ── The Sunless Trench (tier 5) names no foes of its own: the pool builder
  #    carries the Reaches' Abomination and Lord out to it, thinned by
  #    lower-tier-decay, so the Trench roams the same enemies as tier 4 but
  #    sparser — a deadlier echo, not a new bestiary. Its guaranteed Mariphage
  #    Core (the nest's resident boss) is what makes the ring lethal. Give
  #    tier 5 its own entries here if you ever want Trench-only foes.

# ---------------------------------------------------------------------------
# Plugin-side signature drops, rolled on top of any MythicMobs pack drops.
# These work identically with or without MythicMobs, because the spawner
# tags every mob it spawns and the drop service reads the tag at death.
#
# Line shapes:
#   { id: <registry item id>, chance: 0..1, min: n, max: n }
#   { set: vironic, tier: 1-4, chance: 0..1 }   -> one random piece of that
#                                                  rank's cultist set
#
# The Cursed carry the weapons their bodies became; the Order wears its
# rank. Everyone out here looted Chronons from somewhere.
#
# The Mariphage Core's signature drops are deliberately NOT guaranteed —
# the Stinger and the Vector are chase items across repeat kills; only its
# Chronon hoard always drops. Reloads with /ds reload.
# ---------------------------------------------------------------------------

drops:
  CrazedSailor:
    - { id: sailors_cutlass, chance: 0.10 }
    - { id: chronon, min: 1, max: 3, chance: 0.35 }
  MutatedNaxian:
    - { id: naxian_claw, chance: 0.08 }
    - { id: chronon, min: 2, max: 4, chance: 0.35 }
  TransmutedNaxian:
    - { id: enhanced_naxian_claw, chance: 0.08 }
    - { id: chronon, min: 2, max: 5, chance: 0.35 }
  NaxianAbomination:
    - { id: abomination_bone, chance: 0.08 }
    - { id: chronon, min: 3, max: 6, chance: 0.35 }
  VironicInitiate:
    - { set: vironic, tier: 1, chance: 0.18 }
    - { id: chronon, min: 1, max: 3, chance: 0.40 }
  VironicAcolyte:
    - { set: vironic, tier: 2, chance: 0.18 }
    - { id: chronon, min: 2, max: 4, chance: 0.40 }
  VironicTemplar:
    - { set: vironic, tier: 3, chance: 0.18 }
    - { id: chronon, min: 2, max: 5, chance: 0.40 }
  VironicLord:
    - { set: vironic, tier: 4, chance: 0.18 }
    - { id: chronon, min: 3, max: 6, chance: 0.40 }
  MariphageCore:
    - { id: mariphage_stinger, chance: 0.30 }
    - { id: relic_mariphage_vector, chance: 0.12 }
    - { id: chronon, min: 24, max: 48, chance: 1.0 }
    - { id: relic_mariphage_sample, chance: 0.15 }
