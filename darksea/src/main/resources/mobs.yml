# ---------------------------------------------------------------------------
# DarkSea — mob sets per island tier
#
# 'type' is tried as a MythicMobs INTERNAL name first (the id you'd use with
# /mm mobs spawn). If MythicMobs doesn't know it, it falls back to a VANILLA
# entity of the same name (e.g. DROWNED, GUARDIAN) — so this file works on a
# fresh server before you've built any custom Mythic mobs.
#
# The entries below are VANILLA mobs on purpose, so encounters work out of the
# box. Swap each 'type' for your MythicMobs internal names as you build them
# (mixing vanilla and Mythic across tiers is fine).
#
# 'weight' picks between entries; 'level' is passed to MythicMobs (ignored by
# vanilla mobs). Reloads with /ds reload.
# ---------------------------------------------------------------------------

# Vanilla mobs chosen so they don't burn in daylight or drown on the sand demo
# platforms — they simply appear and stay, which is what you want to see while
# testing. (DROWNED/GUARDIAN are more thematic but burn/suffocate out of water.)
tiers:
  1:
    - { type: HUSK,       weight: 10, level: 1 }
    - { type: PILLAGER,   weight: 5,  level: 1 }
  2:
    - { type: HUSK,       weight: 8,  level: 5 }
    - { type: VINDICATOR, weight: 4,  level: 3 }
  3:
    - { type: WITCH,      weight: 8,  level: 8 }
    - { type: PILLAGER,   weight: 3,  level: 5 }
  4:
    - { type: RAVAGER,    weight: 8,  level: 10 }
    - { type: VINDICATOR, weight: 2,  level: 8 }
