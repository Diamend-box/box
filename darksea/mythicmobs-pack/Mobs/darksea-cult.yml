# ---------------------------------------------------------------------------
# DarkSea — The Order of the Soul
#
# The cult of the abyssal monolith, reseeding the Mariphage to wake a
# primordial power. Rank climbs with the rings: Initiate → Acolyte →
# Templar → Lord. Their share of island spawns grows the further out you
# sail — the deep sea is theirs.
#
# Internal names here must match `type:` in the plugin's mobs.yml exactly
# (case-sensitive). Stats are flat and deliberately round — what you read is
# what spawns. Tune Health/Damage freely.
# ---------------------------------------------------------------------------

# Ring 1 — The Wild Sea. A fresh recruit posted to the Order's outermost
# watch, sweeping the shallows for trespassers.
VironicInitiate:
  Type: PILLAGER
  Display: '&5Vironic Initiate'
  Health: 25
  Damage: 4
  Options:
    Despawn: true
    PreventOtherDrops: true
  Equipment:
    - CROSSBOW HAND
  Drops:
    - arrow 1to3 0.6
    - emerald 1 0.2

# Ring 2 — The Raging Deep. A zealot proven in the drowned towns. Its
# strikes sap the soul (chance of Weakness on hit).
VironicAcolyte:
  Type: VINDICATOR
  Display: '&5Vironic Acolyte'
  Health: 35
  Damage: 7
  Options:
    MovementSpeed: 0.3
    Despawn: true
    PreventOtherDrops: true
  Equipment:
    - STONE_AXE HAND
  Skills:
    - potion{type=WEAKNESS;duration=100;level=1} @trigger ~onAttack 0.3
  Drops:
    - emerald 1 0.35

# Ring 3 — The Midnight Waters. A war-priest of the Order carrying the
# plague in glass. On top of its thrown potions, striking it can spill the
# Mariphage itself — Vessels skitter out of its robes — and its ward of the
# soul hurls attackers away from it.
VironicTemplar:
  Type: WITCH
  Display: '&5Vironic Templar'
  Health: 50
  Options:
    Despawn: true
    PreventOtherDrops: true
  Skills:
    - summon{type=MariphageVessel;amount=2;radius=3} @self ~onDamaged 0.15
    - throw{velocity=6;velocityY=4} @trigger ~onDamaged 0.2
  Drops:
    - emerald 1to2 0.4
    - glass_bottle 1 0.3

# Ring 4 — The Abyssal Reaches. A high priest of the monolith. Fang rows and
# summoned vex spirits come native; on top of that it speaks the monolith's
# word — a Wither pulse that rots everyone standing near it every few
# seconds. Close range is a commitment. The totem drop is deliberately rare:
# totems would blunt the whole sea.
VironicLord:
  Type: EVOKER
  Display: '&5Vironic Lord'
  Health: 100
  Options:
    Despawn: true
    PreventOtherDrops: true
  Skills:
    - potion{type=WITHER;duration=100;level=1} @PlayersInRadius{r=6} ~onTimer:160 0.7
  Drops:
    - emerald 2to4 0.6
    - totem_of_undying 1 0.15
