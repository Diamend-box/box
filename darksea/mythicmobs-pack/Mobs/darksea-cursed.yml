# ---------------------------------------------------------------------------
# DarkSea — The Cursed
#
# Victims of the Mariphage, the curse-plague the Order of the Soul is
# reseeding across the sea. The deeper the ring, the further the infection
# has gone: crazed → mutated → transmuted → no longer recognizably Naxian.
#
# Internal names here must match `type:` in the plugin's mobs.yml exactly
# (case-sensitive). Tune Health/Damage freely; `LevelModifiers` add the shown
# amount per level above 1 (mobs.yml passes level 1/3/6/10 by ring).
# ---------------------------------------------------------------------------

# Ring 1 — The Wild Sea. A sailor who moored at the wrong island. The
# Mariphage took the mind first; the body still remembers the axe.
CrazedSailor:
  Type: HUSK
  Display: '&2Crazed Sailor'
  Health: 22
  Damage: 3
  Options:
    MovementSpeed: 0.26
    Despawn: true
    PreventOtherDrops: true
    PreventRandomEquipment: true
    PreventTransformation: true
  Equipment:
    - WOODEN_AXE HAND
  LevelModifiers:
    Health: 2
    Damage: 0.25
  Drops:
    - rotten_flesh 1 1
    - copper_ingot 1 0.15

# Ring 2 — The Raging Deep. A Naxian townsperson mid-change: barnacled helm,
# harpoon still in hand, flesh going wrong underneath. Its touch carries the
# plague (chance of Poison on hit).
MutatedNaxian:
  Type: ZOMBIE_VILLAGER
  Display: '&2Mutated Naxian'
  Health: 30
  Damage: 5
  Options:
    MovementSpeed: 0.25
    Despawn: true
    PreventOtherDrops: true
    PreventRandomEquipment: true
    PreventSunburn: true
    PreventTransformation: true
  Equipment:
    - IRON_HELMET HEAD
    - TRIDENT HAND
  Skills:
    - potion{type=POISON;duration=80;level=1} @trigger ~onAttack 0.35
  LevelModifiers:
    Health: 2.5
    Damage: 0.3
  Drops:
    - rotten_flesh 1 1
    - prismarine_shard 1to2 0.25

# Ring 3 — The Midnight Waters. The curse has burned the flesh down to
# blackened bone. What's left hits like the plague itself (native Wither
# on hit).
TransmutedNaxian:
  Type: WITHER_SKELETON
  Display: '&2Transmuted Naxian'
  Health: 40
  Damage: 7
  Options:
    MovementSpeed: 0.28
    Despawn: true
    PreventOtherDrops: true
    PreventRandomEquipment: true
  Equipment:
    - STONE_SWORD HAND
  LevelModifiers:
    Health: 3
    Damage: 0.4
  Drops:
    - bone 1to2 1
    - coal 1to3 0.4

# Ring 4 — The Abyssal Reaches. Whatever this was, it isn't Naxian anymore —
# a mass of cursed muscle the Order lets roam its shores. Hits scramble the
# senses (chance of Nausea).
NaxianAbomination:
  Type: RAVAGER
  Display: '&2Naxian Abomination'
  Health: 110
  Damage: 12
  Options:
    Despawn: true
    PreventOtherDrops: true
    KnockbackResistance: 0.6
  Skills:
    - potion{type=NAUSEA;duration=100;level=1} @trigger ~onAttack 0.4
  LevelModifiers:
    Health: 5
    Damage: 0.5
  Drops:
    - saddle 1 0.1
    - diamond 1 0.2
