# =====================================================================
#  BoxCore — collections
# =====================================================================
# Collections count everything a player has ever gathered of a given
# item. Every threshold ("tier") they cross pays out — by default in
# skill points, which feed the skill trees in trees.yml.
#
# Where the counting happens is set in config.yml -> collections.sources
# (mining a block counts its *drops*, so Fortune and Silk Touch behave
# the way players expect).
#
# ---------------------------------------------------------------------
#  Category options
# ---------------------------------------------------------------------
#   display / icon / order — how the category tab looks and sorts.
#
# ---------------------------------------------------------------------
#  Collection options
# ---------------------------------------------------------------------
#   display          Name shown in the menu.
#   category         Which category tab it belongs to.
#   icon             Material for the menu icon (defaults to the first
#                    tracked item).
#   items            Materials that count toward it. An entry starting
#                    with '#' is an item tag, e.g. "#logs", "#wool",
#                    "#blocks/base_stone_overworld".
#   source           Where the counter comes from. "items" (the default)
#                    means the materials above. "playtime" means hours
#                    played, fed by the playtime module — no items
#                    needed. A collection with a source other than
#                    "items" is counted for the player automatically.
#   unit             Optional noun shown after the amount, e.g. "hours".
#   points-per-tier  Skill points paid for each tier (default 1).
#   tiers            Either a plain list of amounts:
#                        tiers: [50, 250, 1000]
#                    or a list with per-tier rewards:
#                        tiers:
#                          - amount: 50
#                            points: 1
#                            xp: 100
#                            message: "<green>Nice."
#                            commands: [ "give %player% diamond 1" ]
# =====================================================================

