  # -------------------------------------------------------------------
  #  Time served — hours played, fed by the playtime module.
  # -------------------------------------------------------------------
  # This is a collection rather than a per-hour trickle on purpose: the
  # last tier below is the last skill point playtime will ever pay, and
  # a player can see that in the menu instead of assuming it runs
  # forever. Add tiers to raise the ceiling; delete the collection to
  # stop paying for playtime entirely.
  playtime:
    display: "<light_purple>Time Served"
    category: time
    icon: CLOCK
    source: playtime
    unit: hours
    tiers: [ 1, 2, 5, 8, 12, 17, 25, 35, 45, 60, 80, 100 ]
