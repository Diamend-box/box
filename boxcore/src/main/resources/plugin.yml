name: BoxCore
version: '${project.version}'
main: com.diamend.boxcore.BoxCorePlugin
api-version: '1.21'
softdepend: [PlaceholderAPI]
author: diamend
description: Utility and progression core for the Box server — skill trees, collections and more.
website: https://github.com/diamend-box/box

commands:
  box:
    description: Open the BoxCore hub and manage its modules.
    usage: |
      /box                          - Open the BoxCore hub
      /box skills [tree]            - Open your skill trees
      /box collections [category]   - Open your collections
      /box points                   - Show your skill points
      /box respec                   - Refund every unlocked node
      /box compress [on|off]        - Toggle your auto-compressor
      /box expand [all]             - Unfold the compacted units you're holding
      /box modules [list]           - Switch modules on and off (admin)
      /box points <give|take|set> <player> <n> - Adjust points (admin)
      /box unlock <player> <tree.node>         - Force-unlock a node (admin)
      /box collection set <player> <id> <n>    - Set a collection amount (admin)
      /box collection clearplaced [radius]     - Forget placed-block flags (admin)
      /box give <ore> [units] [player]         - Give compressed ore (admin)
      /box compactor give <tier> [player]      - Hand out a compactor (admin)
      /box compactor recipes                   - Edit compaction recipes (admin)
      /box travel                   - Open the places you've found
      /box warp                                - Edit destinations in a menu (admin)
      /box warp <set|move|icon|rename> <id>    - Place and dress a destination (admin)
      /box warp <desc|perm|radius|tp|delete> <id> - Everything else about one (admin)
      /box boost                    - Show the boosts running for you
      /box boost global <type> <multiplier> <duration>   - Boost everyone (admin)
      /box boost player <name> <type> <multiplier> <dur> - Boost one player (admin)
      /box boost item <id> [player] [amount] [duration]  - Give a boost item (admin)
      /box boost clear [global|<player>]                 - End boosts early (admin)
      /box reset <player>                      - Wipe a player's BoxCore data (admin)
      /box reload                              - Reload configuration from disk (admin)
    aliases: [boxcore, bx]
  fasttravel:
    description: Open the fast travel menu. Same as /box travel.
    usage: /fasttravel
    aliases: [fastravel, ft]

permissions:
  boxcore.use:
    description: Allows opening the BoxCore hub, skill trees and collections.
    default: true
  boxcore.respec:
    description: Allows refunding your own skill points.
    default: true
  boxcore.admin:
    description: Allows granting points, unlocking nodes and editing player data.
    default: op
