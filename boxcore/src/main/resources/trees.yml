# =====================================================================
#  BoxCore — skill trees
# =====================================================================
# Everything here is hot-reloadable with /box reload. Players keep the
# nodes they own; if you delete or rename a node, the points that were
# spent on it are handed back automatically.
#
# ---------------------------------------------------------------------
#  Tree options
# ---------------------------------------------------------------------
#   display      Menu title / hub name.
#   icon         Material shown in the tree picker.
#   description  Lore lines for the tree picker.
#   rows         GUI height, 1-6 (default 6 = 54 slots, 0-53).
#   order        Sort order in the picker (low first).
#   permission   Optional permission needed to see/use the tree.
#
# ---------------------------------------------------------------------
#  Node options
# ---------------------------------------------------------------------
#   slot            GUI slot (0-based). Must fit inside `rows`.
#   icon            Material for the node.
#   locked-icon     Optional material shown before it's unlocked.
#   display         Node name.
#   description     Lore lines (shown above the generated effect list).
#   cost            Skill points per level (default 1).
#   costs           Per-level costs, e.g. [1, 2, 3] — overrides `cost`.
#   max-level       How many times it can be taken (default 1).
#   requires        Prerequisite nodes in this tree. "id" means level 1,
#                   "id:3" means at least level 3 of that node.
#   requires-points Points that must already be spent in this tree.
#   requires-permission  Optional permission gate for a single node.
#
# ---------------------------------------------------------------------
#  Node effects
# ---------------------------------------------------------------------
#   attributes:   vanilla attributes, scaled by the node's level.
#                 Short form  ->  max_health: 2.0        (ADD_NUMBER)
#                 Long form   ->  movement_speed:
#                                   amount: 0.05
#                                   operation: add_scalar
#                 Operations: add_number (flat), add_scalar (percent of
#                 base), multiply_scalar_1 (percent of the total).
#   potions:      permanent, hidden potion effects.
#                 - effect: haste
#                   amplifier: 0            # 0 = level I
#                   amplifier-per-level: 1  # +1 per node level
#   permissions:  permission nodes granted while the skill is owned.
#   commands:     console commands run once, when the node is unlocked.
#                 %player% and %uuid% are replaced.
# =====================================================================

trees:

  # -------------------------------------------------------------------
  combat:
    display: "<red><bold>Combat</bold>"
    icon: IRON_SWORD
    description:
      - "<gray>Hit harder, live longer."
    rows: 6
    order: 1
    nodes:

      toughness:
        slot: 11
        icon: RED_DYE
        display: "<red>Toughness"
