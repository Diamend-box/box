# =====================================================================
#  BoxCore configuration
# =====================================================================
# BoxCore is a modular utility plugin: each feature below is a module
# that can be switched off without touching the rest of the plugin.
# More modules will be added over time — new ones appear here with an
# "enabled" toggle and are automatically added to the /box hub.
#
# Skill trees live in  trees.yml
# Collections live in  collections.yml
#
# All text supports MiniMessage (<green>, <gradient:#a:#b>…) and classic
# '&' colour codes, mixed freely.

modules:
  skills:
    enabled: true
  collections:
    enabled: true
  playtime:
    enabled: true
  compressor:
    enabled: true
  boosts:
    enabled: true
  travel:
    enabled: true

# ---------------------------------------------------------------------
# Skill trees
# ---------------------------------------------------------------------
skills:
  # Points every player starts with the first time they join.
  starting-points: 0

  # Allow players to refund all of their spent points with /box respec.
  allow-respec: true

  # What a respec costs, as an item the player has to hold in their
  # inventory. Charging an item rather than skill points means a respec
  # is something you obtain — a crate reward, a shop purchase, a boss
  # drop — instead of a tax on the points you already earned.
  respec-item:
    # Material to consume. Set to "" for free respecs.
    item: NETHER_STAR
    # How many of it a respec costs.
    amount: 1
    # Optional: only items with exactly this display name count, so a
    # plain nether star can't be used as a respec token. Supports colour
    # codes. Leave blank to accept any item of the right type.
    name: ""

  # Console commands run when a player respecs (e.g. an economy charge).
  # %player% and %uuid% are replaced.
  respec-commands: []

  # Re-apply permanent potion effects on this interval (seconds) so other
  # plugins clearing effects (or a bucket of milk) can't strip an effect a
  # player paid for. Set to 0 to only apply on join/respawn/unlock.
  effect-refresh-seconds: 30

  # Show an action-bar summary of a node's effects when it is unlocked.
  unlock-feedback: true

# ---------------------------------------------------------------------
# Collections (Hypixel SkyBlock style)
# ---------------------------------------------------------------------
collections:
  # Where collection progress is counted from. Turning a source off stops
  # it contributing entirely.
  sources:
    # Mining/chopping/digging: counts what the block actually drops, so
    # Silk Touch and Fortune are respected.
    block-break: true
    # Player kills: counts the mob's drops.
    entity-kill: true
    # Fishing: counts what was reeled in.
    fishing: true
    # Right-click harvesting (sweet berries, cave vines…).
    harvest: true
    # Crafting the item. Off by default — crafting usually consumes items
    # that were already counted when they were gathered.
    craft: false
    # Picking an item up off the floor. Off by default: it double-counts
    # anything you mined or farmed yourself, and counts other players'
    # drops as your own.
    pickup: false

  # When false, breaking a block that a player placed doesn't count
  # (stops place-and-break farming).
  #
  # The flags are stored in the chunk itself, so they survive a restart and
  # unload with the chunk rather than piling up in memory. Each flag also
  # remembers which block was placed: if something later replaces that block
  # — a regenerating mine, a WorldEdit paste — the new block counts normally
  # and the stale flag is dropped. Pistons carry flags with the blocks they
  # push, so shoving a placed block one space over doesn't launder it.
  #
  # If a mine is rebuilt by a plugin that never fires a place event and you
  # want to wipe the flags there by hand, stand in it and run
  #   /box collection clearplaced [chunk radius]
  count-player-placed-blocks: false

  # Notify the player when they reach a new collection tier.
  announce-tiers: true
  # Also show a title on screen for the tier-up.
  tier-title: false

# ---------------------------------------------------------------------
# Playtime → skill points
# ---------------------------------------------------------------------
playtime:
  # Hours played are recorded into a collection, so the payout and the
  # ceiling are the tiers of that collection — see collections.yml. That
  # keeps the limit visible to players instead of implied.
  #
  # Hours are read from the server's own playtime statistic, so time
  # played before installing BoxCore still counts.
  #
  # Which collection to feed. Leave blank to use whichever collection
  # declares `source: playtime`.
  collection: playtime

# ---------------------------------------------------------------------
# Ore
# ---------------------------------------------------------------------
ore:
  # Which raw items count as ore. Raw forms only: smelted output (ingots)
  # is deliberately not here, and nothing on this list may be a placeable
  # block — placing one would move ore somewhere nothing counts it. That
  # rules out ANCIENT_DEBRIS in particular; use NETHERITE_SCRAP instead.
  # Leave the list empty to use the built-in default, which is this one.
  whitelist:
    - RAW_IRON
    - RAW_GOLD
    - RAW_COPPER
    - DIAMOND
    - EMERALD
    - COAL
    - LAPIS_LAZULI
    - REDSTONE
    - QUARTZ
    - NETHERITE_SCRAP

# ---------------------------------------------------------------------
# Personal compactor
# ---------------------------------------------------------------------
# A carried item that folds up whichever recipes a player has slotted into
# it, so they can stay out longer before inventory space forces them back.
# A compacted unit is worth exactly what went into it, so this buys time,
# never value.
#
# What compacts is decided by the item, not by anything on the player: no
# compactor means nothing folds. Slot count comes from the compactor's
# tier, which is the seam a progression system plugs into later.
#
# Recipes live in compactor.yml, edited in game with
# /box compactor recipes. The 'ores' block at the bottom of this section
# is only read once, to seed that file the first time.
compressor:
  # Tiers of compactor, and how many recipes each one holds. Hand them out
  # with /box compactor give <tier> [player].
  tiers:
    1: { name: "<gray>Personal Compactor 4000", slots: 1,  material: HOPPER }
    2: { name: "<white>Personal Compactor 5000", slots: 3,  material: HOPPER }
    3: { name: "<aqua>Personal Compactor 6000", slots: 6,  material: HOPPER, glow: true }
    4: { name: "<light_purple>Personal Compactor 7000", slots: 12, material: HOPPER, glow: true }

  # How many raw items make one unit when seeding compactor.yml from the
  # 'ores' block below. Ignored once compactor.yml exists — change amounts
  # per recipe in the editor instead.
  ratio: 64

  # After expanding a unit by hand, don't re-compact that player for this
  # many seconds — otherwise items expanded to use in an anvil or
  # enchanting table get folded straight back up before they reach one.
  expand-grace-seconds: 30

  # How often (in ticks) to sweep players who have gained items. Only
  # players who actually picked something up are looked at.
  sweep-ticks: 20

  # Seed recipes. Read ONCE, on the first run that has no compactor.yml,
  # and written into that file — after which this block does nothing and
  # recipes are managed in game with /box compactor recipes.
  #
  # 'collection' and 'tier' are left over from the tier-gated compressor
  # and are ignored: a compactor is what unlocks compacting now.
  #
  # Each ore may also carry an optional 'item:' block describing how its
  # compressed form looks. Everything in it is optional:
  #
  #   item:
  #     material: COAL        # what it renders as (default: the ore itself)
  #     name: "&8&lCoal Briquette"
  #     lore:
  #       - "&7A stack of coal, pressed flat."
  #       - "<dark_gray>Worth <ratio> <ore>."
  #     model-data: 1001      # for a resource pack; 0 = none
  #     glow: true
  #
  # Name and lore take classic colour codes (&a, &l, &#ff8800) and
  # MiniMessage tags (<gray>, <bold>, <#ff8800>), mixed freely. Always
  # quote a value that starts with & — bare & begins a YAML anchor and
  # the file will fail to load.
  #
  # <ratio>, <ore> and <Ore> are replaced in name and lore.
  #
  # What a compressed unit is *worth* is stored on the item, not read from
  # its material, so re-skinning one never changes its value. One limit:
  # the material cannot be a placeable block, because placing it would move
  # ore out of the inventory without anything counting it. A block here is
  # refused with a warning and the ore's own item used instead.
  ores:
    COAL:            { collection: coal,           tier: 1 }
    RAW_IRON:        { collection: iron,           tier: 1 }
    RAW_COPPER:      { collection: copper,         tier: 1 }
    REDSTONE:        { collection: redstone,       tier: 2 }
    LAPIS_LAZULI:    { collection: lapis,          tier: 2 }
    RAW_GOLD:        { collection: gold,           tier: 2 }
    QUARTZ:          { collection: quartz,         tier: 2 }
    DIAMOND:         { collection: diamond,        tier: 3 }
    EMERALD:         { collection: emerald,        tier: 3 }
    NETHERITE_SCRAP: { collection: ancient_debris, tier: 3 }

# ---------------------------------------------------------------------
# Boosts
# ---------------------------------------------------------------------
# Temporary multipliers, running server-wide or for one player. Two types:
#
#   drops        multiplies how much ore a broken block actually drops
#   collections  multiplies how much everything counts toward collections
#   all          both at once
#
# The two are independent on purpose. Collections are credited from what a
# block naturally drops rather than from the items that land on the floor,
# so a drops boost gives more ore without inflating collection progress,
# and neither quietly compounds into the other.
boosts:
  # One global boost and one personal boost run per type at a time, and
  # starting another replaces the one it matches rather than stacking on
  # top. So the most anyone can have is global x personal: a 2x global and
  # a 2x personal make 4x, and a second 2x item replaces the first rather
  # than making 8x.
  #
  # This is the hard ceiling no combination can pass. Raise it on purpose.
  max-multiplier: 8.0

  # Announce global boosts in chat when they start.
  announce: true

  # Telling players what's running. A boost that ends silently reads as the
  # server quietly taking something back, so this is on by default.
  notify:
    # A live line above the hotbar while any boost is running, showing the
    # multiplier and how long is left. Other plugins that write to the
    # actionbar will take turns with it.
    actionbar: true

    # Chat warning before a boost ends, and a line when it does.
    chat: true

    # How long before the end to warn. 0 turns the warning off but keeps
    # the "it ended" line. A boost shorter than this never warns — being
    # told a 30s boost has 60s left would be nonsense.
    warn-seconds: 60

    # How often to refresh the actionbar and check for expiry, in ticks.
    # 20 is once a second, which is what a countdown needs. Minimum 10.
    interval-ticks: 20

  drops:
    # Only multiply drops of whitelisted ore (the 'ore.whitelist' above).
    # Off by default: a drops boost is understood to mean everything a
    # block gives, and a plugin that replaces drops with something that
    # isn't whitelisted ore would otherwise get no boost at all and look
    # broken. Turn it on to go back to ore only.
    ores-only: false

    # How long after a block breaks its drops still count as that block's,
    # in ticks. Boosting reads the items that appear rather than only the
    # ones the game itself produced, because a plugin that replaces drops
    # entirely cancels the break and spawns its own — there is no event to
    # listen to for that, only items appearing next to a block someone
    # just broke.
    #
    # Longer catches slower plugins. Too long starts catching items that
    # had nothing to do with the block. 5 ticks is a quarter of a second.
    window-ticks: 5

    # Last resort, for plugins that put a block's yield straight into the
    # inventory without ever dropping an item. Nothing reports that — no
    # drop event, no spawn event, no pickup event — so the only evidence
    # is that the player is carrying more than they were a tick ago.
    #
    # Only runs when nothing was found on the ground for that break, so a
    # normal drop is never counted twice, and only for players who have a
    # drops boost running. Turn it off if you see drops being doubled.
    capture-inventory: true

    # Materials a boost must never multiply, on top of the built-in rules.
    #
    # Anything holding an inventory is always refused and cannot be turned
    # back on. A shulker box drops as a single item carrying all of its
    # contents, so doubling that item doubles every stack inside it — that
    # is duplication, not a bigger yield. Filled bundles and pre-filled
    # container items are refused for the same reason.
    #
    # This list is for the things specific to your server that are safe by
    # those rules but still should not double — a crate key, a currency
    # item, anything you sell.
    never-multiply: []

    # Whether items that cannot stack may be multiplied.
    #
    # Off by default: an unstackable item has no quantity to multiply, so
    # copying one mints a second unique thing instead of doubling an
    # amount, and a tool arriving in fours is rarely what a drops boost was
    # meant to do. Turn it on if your custom drops are unstackable by
    # design and you do want them boosted.
    multiply-unstackable: false

  # How often (in ticks) to expire finished boosts and open scheduled
  # windows. 100 ticks is five seconds, which is plenty.
  check-ticks: 100

  # Timezone for the schedule below, e.g. "Europe/London", "America/New_York".
  # Leave blank to use whatever the machine running the server is set to.
  timezone: ""

  # Recurring global boosts that start on their own. A window that is
  # already open when the server starts is picked back up, so a restart
  # mid-event doesn't cancel it.
  #
  # schedule:
  #   - days: [FRIDAY, SATURDAY, SUNDAY]
  #     start: "18:00"       # HH:mm, in the timezone above
  #     duration: 4h         # 90s, 30m, 2h30m, 1d
  #     type: all            # drops, collections or all
  #     multiplier: 2.0
  schedule: []

  # Boost items players can right-click to start their own boost. Give one
  # with /box boost item <id> [player] [amount] [duration] [multiplier] —
  # sell it, put it in a crate, hand it out as a reward. Either override
  # replaces just that figure, so a one-off 5x-for-24h version of a
  # configured 2x-for-30m item is a real item rather than a config entry
  # that has to exist forever to support it. Both are written onto the
  # item like everything else, so the item is still correct even when
  # overridden.
  #
  # What an item does is written onto the item when it is created, so
  # re-tuning an entry here changes items made from now on and never
  # silently rewrites one already sitting in someone's ender chest.
  #
  # The optional 'item:' block skins it, exactly like the compressor's:
  # material, name, lore, model-data and glow are all optional, and both
  # colour codes (&a, &l, &#ff8800) and MiniMessage tags work. <multiplier>,
  # <duration> and <type> are replaced in name and lore.
  #
  # Use the <multiplier> and <duration> tokens rather than typing the
  # number, even here where it matches the entry below — a name that
  # spells out "2x" or "(30m)" as literal text goes stale the moment
  # duration or multiplier changes below it, or the moment somebody hands
  # one out with an override at the command line.
  items:
    drops-2x:
      type: drops
      multiplier: 2.0
      duration: 30m
      item:
        material: EXPERIENCE_BOTTLE
        name: "&d&l<multiplier>x Drops Boost &7(<duration>)"
        glow: true
    collections-2x:
      type: collections
      multiplier: 2.0
      duration: 30m
      item:
        material: EXPERIENCE_BOTTLE
        name: "&b&l<multiplier>x Collections Boost &7(<duration>)"
        glow: true

    # 'global: true' makes using it start a server-wide boost instead of a
    # personal one, exactly as if staff had run /box boost global. It is
    # announced to everyone and saved, so it survives a restart. Worth
    # pricing accordingly: one player spends it, the whole server gets it.
    server-drops-2x:
      type: drops
      multiplier: 2.0
      duration: 1h
      global: true
      item:
        material: DRAGON_BREATH
        name: "&6&lServer <multiplier>x Drops &7(<duration>)"
        glow: true

# ---------------------------------------------------------------------
# Storage
# ---------------------------------------------------------------------
# Save all online players' data to disk every X minutes (crash safety
# net). 0 disables periodic saving; data is always saved on quit and on
# shutdown.
autosave-minutes: 5

# ---------------------------------------------------------------------
# Fast travel
# ---------------------------------------------------------------------
# Destinations are set by staff with /box warp set <id> and found by
# players walking into them. Warps live in warps.yml, which the plugin
# writes; nothing here needs editing to add one.
#
# The warmup and the combat tag are what stop this being a free escape
# from a losing fight. Turning both off makes /box travel an instant
# teleport out of any PvP encounter.
travel:
  # Seconds a player must stand still before arriving. 0 teleports
  # immediately.
  warmup-seconds: 3

  # Where a destination lands when staff place one by standing there.
  # Lining yourself up on the middle of a block, looking squarely down a
  # cardinal direction, is fiddly to do by hand and obvious when it's
  # wrong, so both are tidied up on the way in.
  snap:
    # Put the destination on the centre of the block you're standing on
    # rather than the exact spot your feet stopped at.
    centre: true

    # Which way you're looking when you arrive:
    #   nearest  - round to the closest quarter turn (default)
    #   north / east / south / west - always that way
    #   keep     - exactly however the placer was looking
    # Any single destination can be turned afterwards from /box warp.
    facing: nearest

  # Whether stepping off the block you started on cancels the trip.
  # Taking damage always cancels it, regardless of this.
  cancel-on-move: true

  # How long after player-versus-player damage travelling is refused.
  # Only PvP tags — being hit by a mob doesn't.
  combat-tag-seconds: 15

  # How close a player must get to find a warp, in blocks. Per-warp
  # values in warps.yml override this.
  default-radius: 8

  # Whether walking within a destination's radius puts it on your travel
  # list. Off by default: a map you can sell is worth nothing if the same
  # place arrives free the first time somebody wanders past it. With this
  # off, a map (travel.items with mode: unlock, or /box warp item <id> map)
  # is the only way onto a player's list — staff still get a destination
  # the moment they place it, since they're standing on it.
  #
  # Nothing travels to a place that isn't on your list, ticket or not.
  discover-by-walking: false

  # Whether to say so in chat the first time someone finds a place.
  announce-discovery: true

  # How a destination the player hasn't unlocked looks in the travel menu.
  # Shown rather than hidden, so the list is a reason to go looking.
  #
  # <warp> in the name or lore is replaced with the destination's real
  # name — leave it out (as below) and the entry gives nothing away.
  # Set lore to [] for none at all.
  locked:
    material: GRAY_DYE
    name: "<dark_gray>???"
    lore:
      - "<gray>Somewhere you haven't been."
      - "<dark_gray>Find it and it opens up here."

  # Sound for finding a place, for the warmup ticking down, for arriving
  # and for a trip being cut short. The cancel sound is the one that
  # earns its keep: it tells you the trip stopped without you having to
  # be looking at the action bar.
  sounds: true

  # How the travel menu orders destinations:
  #   found     places you've found first, then the rest, each by name
  #   name      by name, found or not
  #   distance  nearest first, other worlds last — note this also hints
  #             at how far away the places you haven't found are
  #   file      however warps.yml happens to list them
  menu-order: found

  # Items that get you to a destination. Hand one out with
  # /box warp item <id> [player] [amount], or sell it from a shop.
  #
  # Entries here are only for items you want to dress up. Any destination
  # can have a plain one minted on the spot without being listed:
  #   /box warp item <destination> map      unlocks it for good
  #   /box warp item <destination> ticket   one trip there
  #
  # Two modes:
  #   travel  a ticket: one trip there, spent when you arrive. Being cut
  #           short by a sword costs you the trip, not the ticket.
  #   unlock  a map: puts the place on your travel list for good, exactly
  #           as if you'd walked to it.
  #
  # A ticket stands in for the destination's permission — that is what
  # buying one is for — but never for the combat tag. An item that
  # teleports you out of a fight would be worth more as an escape than
  # as travel, so it refuses while you're tagged and stays in your
  # inventory.
  #
  # 'warp' is a warps.yml id, or 'any' with mode: unlock for every
  # destination the holder is allowed to see. Names and lore take
  # <warp>, <mode> and <id>; don't type the destination in by hand or it
  # goes stale the moment the place is renamed.
  items:
    spawn-ticket:
      warp: spawn
      mode: travel
      item:
        material: PAPER
        name: "&b&lTravel Ticket &7(<warp>)"
        lore:
          - "&7One trip to &f<warp>&7."
          - "&7Spent when you arrive."
          - ""
          - "&8Right-click to use."
        glow: true

    world-map:
      warp: any
      mode: unlock
      item:
        material: FILLED_MAP
        name: "&e&lExplorer's Map"
        lore:
          - "&7Adds every destination to your"
          - "&7travel list, for good."
          - ""
          - "&8Right-click to use."
        glow: true

# ---------------------------------------------------------------------
# Messages
# ---------------------------------------------------------------------
messages:
  prefix: "<gradient:#5ee7df:#b490ca><bold>Box</bold></gradient> <dark_gray>»</dark_gray> "
  no-permission: "<red>You don't have permission to do that."
  players-only: "<red>Only players can use that."
  unknown-player: "<red>Never seen a player called <white><name></white>."
  point-earned: "<green>+<amount> skill point<plural> <gray>(<source>)"
  node-unlocked: "<green>Unlocked <white><node></white><gray>!"
  node-cant-afford: "<red>You need <white><cost></white> point<plural> for that — you have <white><have></white>."
  node-locked: "<red>Locked: <gray><reason>"
  node-maxed: "<yellow>That node is already at its maximum level."
  respec-done: "<green>Refunded <white><amount></white> skill point<plural>."
  respec-disabled: "<red>Respeccing is disabled on this server."
  respec-needs-item: "<red>A respec costs <white><amount>x <item></white>. You have <white><have></white>."
  respec-nothing: "<yellow>You haven't spent any skill points yet."
  tier-up: "<aqua><collection></aqua> <gray>collection reached tier <white><tier></white><gray>!"
  # Shown when the Second Chance perk saves a player from a killing blow.
  second-chance: "<gold>Second Chance <gray>pulled you back from the brink."
  compressor-on: "<green>Compacting <white>resumed<green>."
  compressor-off: "<yellow>Compacting <white>paused<yellow>."
  compressor-expanded: "<aqua>Expanded <white><amount></white> compacted <ore><plural><gray> — won't re-compact for <white><seconds></white>s."
  compressor-no-room: "<red>Not enough inventory space to expand that."
  compressor-not-compacted: "<red>That isn't a compacted unit. <gray>Compacted units glint and say what they are worth."
  compactor-none: "<red>You aren't carrying a personal compactor."
  compactor-kept: "<yellow>Your compactor stays with you."
  compactor-moved: "<red>That compactor isn't where it was."
  recipe-added: "<green>Added recipe <white><id></white>. Set the amount and the look here."
  recipe-deleted: "<yellow>Deleted recipe <white><id></white>."
  recipe-duplicate: "<red>Something already compacts that item, as <white><id></white>."
  recipe-needs-item: "<red>Hold the item you want to use first."
  recipe-placeable: "<red>A placeable block can't be a compacted skin — placing one would move items out of the inventory uncounted."
  recipe-confirm-delete: "<yellow>Shift-click to confirm deleting this recipe."
  travel-starting: "<aqua>Travelling to <white><warp></white> — hold still for <white><seconds></white>s."
  travel-arrived: "<green>Arrived at <white><warp></white>."
  travel-cancelled: "<yellow>Travel cancelled."
  travel-cancelled-moved: "<yellow>You moved, so the trip was cancelled."
  travel-cancelled-hurt: "<red>You took damage, so the trip was cancelled."
  travel-in-combat: "<red>Not while you're in combat — <white><time></white> left."
  travel-discovered: "<green>You found <white><warp></white>! It's on your travel list now."
  travel-unavailable: "<red><white><warp></white> isn't reachable right now."
  travel-item-known: "<gray>You already know everywhere that would have shown you — keeping it."
  travel-item-busy: "<yellow>You're already travelling."
  travel-not-found: "<red>You haven't found <white><warp></white> yet."
  boost-global-started: "<light_purple><bold>BOOST!</bold> <white><multiplier>x <type></white> for everyone, for <white><duration></white>."
  boost-activated: "<light_purple>Started your <white><multiplier>x <type></white> boost — <white><duration></white>."
  boost-none: "<gray>No boosts are running right now."
  boost-ending: "<yellow>Your <white><multiplier>x <type></white> boost ends in <white><time></white>."
  boost-ended: "<gray>Your <white><multiplier>x <type></white> boost has ended."
  boost-global-ending: "<yellow>The server-wide <white><multiplier>x <type></white> boost ends in <white><time></white>."
  boost-global-ended: "<gray>The server-wide <white><multiplier>x <type></white> boost has ended."
